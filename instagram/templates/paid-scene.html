<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<script src="deck.js"></script>
<title>Aura · paid-scene</title>
<script>
/* ============================================================
   PAID SCENE — cena de VIDEO DE ANUNCIO (nao e post organico).
   Campanha AURA-PAID01 · Meta/Instagram · trafego frio BR.

   DIFERENCAS vs o fluxo organico:
   - 1080x1920 (9:16) — posicionamento Reels/Stories de ANUNCIO
   - 100% PT-BR, inclusive a arte (decisao da Midia Paga: BR sub-servido)
   - ZONAS SEGURAS obrigatorias: nada critico nos 14% de cima (UI do Reels)
     nem nos 20% de baixo (perfil + botao de CTA do anuncio)
   - legenda QUEIMADA no rodape da zona segura (maioria assiste sem som)
   - SEM "link na bio" — o anuncio tem botao de CTA proprio

   Numeros: TODOS extraidos das telas reais (auta-total.png / aura-total2.png).
   Nada de output de solver — a Aura nao e solver (ver product-truth-aura.md §0).
   ============================================================ */
const CONFIG = {
  kicker: "", big: "", line: "", caption: "",
  block: null,          // {type:'vs'|'bars'|'preflop'|'postflop'|'stats'|'shot', ...}
  cta: false, ctaBtn: "", ctaSub: "",
  lang: "pt",           // "pt" | "en" — troca os rotulos fixos da UI
  heroBg: "",           // v2: print REAL full-bleed atras do gancho (credibilidade + Ken Burns)
  guides: false,        // true => desenha as zonas seguras (so p/ conferencia)
  /* ---- v3 (variante -b): tudo OPT-IN pra nao alterar os videos de CONTROLE.
     Se estes campos ficarem vazios o template renderiza exatamente como na v2. ---- */
  callout: "",          // chip de callout de audiencia ("Pra quem joga MTT online")
  proof: "",            // selo de prova social persistente no rodape
  heroFocus: false,     // scrim forte atras do texto do gancho (le o titulo E o produto)
  heroLogo: false,      // logo completa (PNG) no gancho — sinaliza "app novo" logo de cara
  anim: 1,              // 0..1 — progresso da animacao (count-up / barras / reveal)
};
(function(){try{var q=new URLSearchParams(location.search);var id=q.get('p');
if(id&&window.DECK&&window.DECK[id])Object.assign(CONFIG,window.DECK[id]);
if(q.get('guides'))CONFIG.guides=true;
var a=q.get('a'); if(a!==null)CONFIG.anim=Math.max(0,Math.min(1,parseInt(a,10)/100));}catch(e){}})();
// rotulos fixos da UI por idioma (o resto do texto vem do deck ja traduzido)
const T = (CONFIG.lang === "en")
  ? { action:"Action", defense:"Defense", realDefense:"Real defense", expSizes:"Exploitative sizes",
      ctaBtn:"Create free account", ctaSub:"Preview of every module. No card." }
  : { action:"Ação", defense:"Defesa", realDefense:"Defesa real", expSizes:"Tamanhos exploráveis",
      ctaBtn:"Criar conta grátis", ctaSub:"Preview de cada módulo. Sem cartão." };
</script>
<style>
@font-face{font-family:"Montserrat";src:url("fonts/Montserrat-Variable-latin.woff2") format("woff2");font-weight:100 900;font-display:block}
:root{
  --bg:#020617;--amber:#FBBF24;--amber3:#FCD34D;--amber6:#D97706;--gold:#D4A418;
  --ink:#fff;--ink-soft:#CBD5E1;--ink-dim:#64748B;
  --app:#0B1220;--line:#1E2A40;
  --pos:#34D399;--neg:#F87171;
  /* zonas seguras do anuncio: 14% topo · 20% base (de 1920) */
  --safe-top:269px; --safe-bot:384px;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden}
body{font-family:"Montserrat","Segoe UI",sans-serif;color:var(--ink);
  background:radial-gradient(1250px 950px at 50% 12%, rgba(34,53,89,0.6), transparent 62%),
    radial-gradient(1050px 900px at 50% 96%, rgba(212,164,24,0.16), transparent 62%), var(--bg);
  position:relative}
.suits{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.suits span{position:absolute;font-family:"Segoe UI Symbol","Segoe UI",sans-serif;color:rgba(251,191,36,0.038);user-select:none}
.arc{position:absolute;top:-520px;left:50%;transform:translateX(-50%);pointer-events:none;filter:drop-shadow(0 0 26px rgba(212,164,24,0.28))}
.glow{position:absolute;left:50%;top:52%;transform:translate(-50%,-50%);width:1150px;height:900px;pointer-events:none;
  background:radial-gradient(50% 50% at 50% 50%, rgba(251,191,36,0.13), transparent 70%)}

/* ---- v2: HERO com print REAL full-bleed atras (produto visivel no frame 1) ----
   O print entra grande e escurecido; o texto vem por cima com vinheta pra contraste.
   Combinado com o push-in do ffmpeg, resolve "frame 1 estatico" + "cade o produto". */
.herobg{position:absolute;inset:0;z-index:0;overflow:hidden}
.herobg img{position:absolute;left:50%;top:46%;transform:translate(-50%,-50%);
  width:132%;max-width:none;display:block;filter:saturate(1.05) contrast(1.03)}
.herobg .veil{position:absolute;inset:0;
  background:linear-gradient(180deg, rgba(2,6,23,0.90) 0%, rgba(2,6,23,0.62) 26%, rgba(2,6,23,0.55) 46%,
    rgba(2,6,23,0.82) 68%, rgba(2,6,23,0.96) 100%)}
.herobg .tint{position:absolute;inset:0;background:radial-gradient(70% 45% at 50% 44%, rgba(251,191,36,0.12), transparent 70%)}
/* escurece SO atras do bloco de texto — mantem o produto visivel no resto */
.herobg .focus{position:absolute;inset:0;background:radial-gradient(62% 27% at 50% 41%, rgba(2,6,23,0.74), transparent 74%)}
/* v3 (opt-in `heroFocus`): SCRIM FORTE atras do bloco de texto.
   Tentei antes o caminho oposto — clarear o veu global pra "mostrar mais
   produto" — e o resultado foi titulo em cima de tabela de numeros, ilegivel.
   Aqui a faixa do texto fica quase opaca e o print segue visivel em cima e
   embaixo: da pra ler o titulo E reconhecer o software. */
body.herofocus .herobg .focus{background:
  linear-gradient(180deg, transparent 0%, rgba(2,6,23,0.55) 16%, rgba(2,6,23,0.93) 30%,
    rgba(2,6,23,0.95) 55%, rgba(2,6,23,0.72) 66%, transparent 82%)}

/* v2.1: logo grande PNG (Ativo 80@2x) sobe pro lugar do mark pequeno —
   so 1 logo por cena, nao mark+herologo empilhados. Vazio quando !heroLogo. */
.toplogo{display:flex;justify-content:center;margin-bottom:34px}
.toplogo img{width:420px;height:auto;display:block}

/* v3: chip de callout de audiencia — diz PRA QUEM e, sem diluir o jargao */
.callout{display:inline-flex;align-items:center;gap:12px;align-self:center;margin-bottom:26px;
  font-size:25px;font-weight:800;letter-spacing:0.12em;text-transform:uppercase;color:var(--amber3);
  background:rgba(251,191,36,0.10);border:2px solid rgba(251,191,36,0.34);border-radius:999px;padding:12px 26px}
.callout::before{content:"";width:11px;height:11px;border-radius:50%;background:var(--amber);flex:none;
  box-shadow:0 0 14px rgba(251,191,36,0.9)}

/* v3: reveal em beat — opacidade/deslocamento calculados por frame no JS */
[data-in]{opacity:0}
body.hero .stage{text-shadow:0 4px 34px rgba(2,6,23,0.85)}

/* ---- v2: print REAL emoldurado (bloco 'shot') ---- */
/* min-height:0 + max-height:100% = rede de seguranca: um print alto demais
   encolhe em vez de vazar pra zona segura (o corte so aparece no render). */
.shotwrap{width:100%;min-height:0;display:flex;flex-direction:column;align-items:center}
.shotframe{position:relative;border-radius:20px;overflow:hidden;background:#0B1120;
  min-height:0;display:flex;flex-direction:column;
  border:1px solid rgba(251,191,36,0.28);
  box-shadow:0 40px 110px rgba(0,0,0,0.72), 0 0 74px rgba(212,164,24,0.12), inset 0 1px 0 rgba(255,255,255,0.06)}
.shotframe img{display:block;width:100%;height:auto;min-height:0;object-fit:contain}
.shotcap{margin-top:20px;font-size:26px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:var(--amber)}

/* Dois dispositivos legíveis no 9:16: em vez de comprimir duas interfaces
   completas lado a lado, uma entra como painel principal e a outra como inset.
   O foco alterna por célula para manter Preflop e Postflop em evidência no lote. */
.twofocus{position:relative;flex:none}
.twofocus .main,.twofocus .inset{position:absolute;overflow:hidden;background:#0B1120;
  border:1px solid rgba(251,191,36,0.28);border-radius:18px;
  box-shadow:0 30px 80px rgba(0,0,0,0.68),0 0 52px rgba(212,164,24,0.12)}
.twofocus img{position:absolute;display:block;max-width:none;height:auto}
.twofocus.pre{width:880px;height:640px}
.twofocus.pre .main{inset:0}
.twofocus.pre .main img{width:1885px;left:-31px;top:-99px}
.twofocus.post{width:820px;height:740px}
.twofocus.post .main{inset:0}
.twofocus.post .main img{width:1749px;left:-894px;top:-92px}
.twofocus .inset{width:286px;height:242px;right:-18px;bottom:-20px;
  border-color:rgba(251,191,36,0.48);box-shadow:0 24px 58px rgba(0,0,0,0.8)}
.twofocus.pre .inset img{width:610px;left:-312px;top:-32px}
.twofocus.post .inset img{width:610px;left:-10px;top:-32px}

/* ---- v2: chrome de janela (le como SOFTWARE, nao como grafico) ---- */
.chrome{display:flex;align-items:center;gap:10px;padding:14px 20px;background:#0A1120;border-bottom:1px solid var(--line)}
.chrome .dot{width:13px;height:13px;border-radius:50%;flex:none}
.chrome .d1{background:#F87171}.chrome .d2{background:#FBBF24}.chrome .d3{background:#34D399}
.chrome .ttl{margin-left:12px;font-size:19px;font-weight:700;color:var(--ink-dim);letter-spacing:0.02em}

/* ---- palco: TUDO vive dentro da zona segura ---- */
.stage{position:absolute;left:0;right:0;top:var(--safe-top);bottom:var(--safe-bot);
  z-index:3;display:flex;flex-direction:column;padding:0 68px}

.core{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:0;overflow:hidden}
/* Mockup de dois monitores: abre 40px de cada lado apenas para o conteúdo da
   cena. Mantém rodapé e zonas seguras intactos, mas dá 1.024px ao produto
   (vs 900px), deixando os dados internos legíveis no frame 9:16. */
body.wide-shot .core{margin-left:-40px;margin-right:-40px}
.kicker{font-size:29px;font-weight:800;letter-spacing:0.22em;text-transform:uppercase;color:var(--amber);margin-bottom:26px}
/* v2.1 (disc-04): kicker com mais peso — a categoria "Inteligencia de field"
   precisa competir de igual pra igual com o headline, nao ficar so como rotulo */
.kicker.lg{font-size:42px;letter-spacing:0.14em;margin-bottom:36px}
.big{font-size:104px;font-weight:900;line-height:1.03;letter-spacing:-0.01em;text-transform:uppercase}
/* dourado CHAPADO — gradiente + background-clip:text apagava a palavra no 9:16 */
.big em{font-style:normal;color:var(--amber);background:none;
  -webkit-background-clip:initial;background-clip:initial;filter:none}
.big.sm{font-size:76px}
.big.xs{font-size:60px;line-height:1.16}
.big.sm em{font-style:normal;color:var(--amber);background:none;
  -webkit-background-clip:initial;background-clip:initial;filter:none}
.line{margin-top:32px;font-size:40px;font-weight:500;line-height:1.34;color:var(--ink-soft);max-width:880px}
.line b{color:#fff;font-weight:800}
.line em{font-style:normal;color:var(--amber);font-weight:700;background:none;
  -webkit-background-clip:initial;background-clip:initial;filter:none}

/* legenda QUEIMADA (assistir sem som) */
.cap{margin-top:auto;align-self:center;max-width:900px;text-align:center;
  font-size:35px;font-weight:700;line-height:1.28;color:#fff;
  background:rgba(2,6,23,0.72);border:1px solid rgba(148,163,184,0.16);
  border-radius:16px;padding:20px 30px;backdrop-filter:blur(2px)}

/* ---------- blocos ---------- */
.block{width:100%;margin-top:44px;min-height:0;display:flex;justify-content:center}

/* VS: dois painies lado a lado */
.vs{display:flex;align-items:stretch;justify-content:center;gap:22px}
.vsp{flex:1;background:rgba(13,20,36,0.78);border:2px solid var(--line);border-radius:22px;padding:46px 24px;
  display:flex;flex-direction:column;align-items:center;gap:14px}
.vsp.hot{border-color:rgba(251,191,36,0.5);box-shadow:0 0 46px rgba(212,164,24,0.14)}
.vsp .lb{font-size:28px;font-weight:800;letter-spacing:0.06em;text-transform:uppercase;color:var(--ink-dim)}
.vsp.hot .lb{color:var(--amber)}
.vsp .vl{font-size:112px;font-weight:900;line-height:1;font-variant-numeric:tabular-nums}
.vsp .sb{font-size:26px;font-weight:600;color:var(--ink-dim)}
.vsmid{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:0 4px}
.vsmid .d{font-size:30px;font-weight:900;color:#0F1526;background:linear-gradient(135deg,var(--amber3),var(--amber6));
  border-radius:999px;padding:12px 20px;white-space:nowrap}

/* BARS: defesa real vs MDF, grande */
.bars{display:flex;flex-direction:column;gap:26px}
.brow{background:rgba(13,20,36,0.78);border:2px solid var(--line);border-radius:20px;padding:26px 30px}
.brow .bt{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.brow .bsz{font-size:34px;font-weight:800;color:#F8FAFC}
.brow .bbadge{font-size:26px;font-weight:800;color:#FCA5A5;background:rgba(239,68,68,0.16);
  border:2px solid rgba(239,68,68,0.36);border-radius:999px;padding:8px 20px}
.brow .bar{position:relative;height:26px;border-radius:999px;background:#080D18;border:1px solid rgba(51,65,85,0.6)}
.brow .bar .fill{position:absolute;inset:0 auto 0 0;border-radius:999px;background:linear-gradient(90deg,#B91C1C,var(--neg))}
.brow .bar .mdf{position:absolute;top:-9px;bottom:-9px;width:6px;background:var(--amber);border-radius:3px;box-shadow:0 0 16px rgba(251,191,36,0.85)}
.brow .bl{display:flex;justify-content:space-between;margin-top:14px;font-size:25px;font-weight:600;color:var(--ink-dim)}
.brow .bl b{color:#E2E8F0;font-weight:800}

/* STATS: linhas de numero grande */
.stats{display:flex;flex-direction:column;gap:16px}
.srow{display:flex;align-items:center;justify-content:space-between;gap:28px;
  background:rgba(13,20,36,0.7);border:2px solid var(--line);border-radius:18px;padding:26px 32px}
.srow .k{font-size:34px;font-weight:600;color:var(--ink-soft)}
.srow .v{font-size:54px;font-weight:900;color:#fff;font-variant-numeric:tabular-nums}
.srow .v em{font-style:normal;color:var(--amber)}

/* UI REAL recriada em vetor (nitida em qualquer tamanho) */
.win{width:100%;border-radius:20px;overflow:hidden;background:var(--app);border:10px solid #1A2233;
  box-shadow:0 40px 100px rgba(0,0,0,0.66), 0 0 64px rgba(212,164,24,0.1)}
.nav{display:flex;align-items:center;gap:18px;padding:16px 22px;border-bottom:1px solid var(--line);background:#0C1424}
.nav .lg{display:flex;align-items:center;gap:9px;color:var(--gold);font-weight:800;font-size:21px;letter-spacing:0.04em}
.nav .lg .i{width:26px;height:21px;color:var(--gold)}
.nav .lg .i svg{width:100%;height:100%;display:block}
.tabs{display:flex;gap:9px}
.tabs .t{font-size:17px;font-weight:600;color:var(--ink-dim);padding:9px 16px;border-radius:10px;white-space:nowrap}
.tabs .t.on{color:#0F1526;font-weight:800;background:linear-gradient(135deg,var(--amber3),var(--amber6))}
.wbody{padding:30px 32px}
.ptitle{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:18px}
.ptitle .n{font-size:29px;font-weight:800;color:#E2E8F0}
.ptitle .r{font-size:19px;color:var(--ink-dim);font-weight:600}
table.pt{width:100%;border-collapse:collapse}
table.pt th,table.pt td{text-align:right;font-size:26px;padding:16px 5px;font-variant-numeric:tabular-nums}
table.pt th:first-child,table.pt td:first-child{text-align:left}
table.pt th{color:var(--ink-dim);font-weight:600;font-size:19px;text-transform:uppercase;letter-spacing:0.04em;border-bottom:1px solid var(--line);padding-bottom:15px}
table.pt th.pos{color:var(--amber)}
table.pt td{color:#E2E8F0;font-weight:700;border-bottom:1px solid rgba(30,42,64,0.5)}
table.pt td.a{text-align:left;color:var(--ink-soft);font-weight:600}
table.pt tr:last-child td{border-bottom:none}
table.pt td.hi{color:var(--amber);font-weight:900}
.up{color:var(--pos)} .dn{color:var(--neg)}
.up small,.dn small{font-size:16px;margin-left:4px;vertical-align:2px}
.pfhead{display:flex;align-items:center;justify-content:space-between;
  background:linear-gradient(180deg,rgba(120,20,20,0.35),rgba(60,12,12,0.15));
  border:1px solid rgba(153,27,27,0.4);border-radius:14px;padding:16px 20px;margin-bottom:18px}
.pfhead .l{display:flex;flex-direction:column;gap:3px}
.pfhead .l .t{font-size:28px;font-weight:800;color:#F1F5F9}
.pfhead .l .s{font-size:19px;color:var(--ink-dim);font-weight:600}
.pfhead .v{font-size:38px;font-weight:900;color:#fff}
.sect{font-size:20px;font-weight:800;letter-spacing:0.1em;text-transform:uppercase;color:var(--amber);margin-bottom:16px}
.cards{display:flex;flex-direction:column;gap:16px}
.card{background:rgba(15,23,42,0.6);border:1px solid var(--line);border-radius:14px;padding:20px 24px}
.card .top{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.card .sz{font-size:28px;font-weight:800;color:#F8FAFC}
.card .badge{font-size:22px;font-weight:800;color:#FCA5A5;background:rgba(239,68,68,0.16);
  border:1px solid rgba(239,68,68,0.34);border-radius:999px;padding:7px 18px}
.card .bar{position:relative;height:16px;border-radius:999px;background:#0B1220;border:1px solid rgba(51,65,85,0.5)}
.card .bar .fill{position:absolute;inset:0 auto 0 0;border-radius:999px;background:linear-gradient(90deg,#B91C1C,var(--neg))}
.card .bar .mdf{position:absolute;top:-6px;bottom:-6px;width:4px;background:var(--amber);border-radius:2px;box-shadow:0 0 10px rgba(251,191,36,0.8)}
.card .lbls{display:flex;justify-content:space-between;margin-top:12px;font-size:21px;color:var(--ink-dim);font-weight:600}
.card .lbls b{color:#CBD5E1;font-weight:700}

/* grade 2x2 de modulos — fechamento 'a plataforma inteira' (disc02) */
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:20px;width:100%}
/* 3 modulos: coluna unica le melhor no 9:16 que 2+1 desbalanceado */
.mgrid.one{grid-template-columns:1fr;gap:16px}
.mgrid.one .mcell{flex-direction:row;justify-content:space-between;padding:26px 34px;text-align:left}
.mcell{background:rgba(13,20,36,0.78);border:2px solid var(--line);border-radius:20px;
  padding:34px 26px;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.mcell .t{font-size:32px;font-weight:800;color:var(--amber)}
.mcell .s{font-size:22px;font-weight:600;color:var(--ink-soft)}

/* ---- cena de CTA ---- */
.ctaWrap{display:flex;flex-direction:column;align-items:center;text-align:center}
.ctaWrap .biglock{display:flex;flex-direction:column;align-items:center;gap:20px;margin-bottom:44px}
.ctaWrap .biglock .icon{width:132px;height:108px;color:var(--gold)}
.ctaWrap .biglock .wm{width:400px;color:var(--gold)}
.ctaWrap .biglock .icon svg,.ctaWrap .biglock .wm svg{width:100%;height:100%;display:block}
.ctaWrap .tagline{font-size:26px;font-weight:800;letter-spacing:0.3em;text-transform:uppercase;color:var(--gold);margin-top:18px}
.btn{margin-top:40px;font-size:44px;font-weight:900;text-transform:uppercase;letter-spacing:0.03em;color:#0F1526;
  background:linear-gradient(135deg,var(--amber3),var(--amber6));border-radius:999px;padding:26px 58px;
  box-shadow:0 22px 60px rgba(212,164,24,0.3)}
.ctasub{margin-top:26px;font-size:32px;font-weight:600;color:var(--ink-soft)}

/* rodape fixo dentro da zona segura */
.foot{display:flex;align-items:center;justify-content:space-between;margin-top:26px;
  border-top:2px solid rgba(30,41,59,0.9);padding-top:20px}
.foot .u{font-size:26px;font-weight:800;letter-spacing:0.07em;text-transform:uppercase;color:var(--gold)}
/* v3: prova social PERSISTENTE — "500M+ mãos" era o maior ativo de credibilidade
   e vivia so no ultimo frame, que quase ninguem alcanca. */
.foot .proof{font-size:21px;font-weight:700;letter-spacing:0.03em;color:var(--ink-soft);opacity:0.92;
  display:flex;align-items:center;gap:10px}
.foot .proof::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--pos);flex:none;
  box-shadow:0 0 10px rgba(52,211,153,0.8)}
.foot .age{font-size:24px;font-weight:800;color:var(--ink-dim);border:3px solid var(--ink-dim);border-radius:11px;padding:5px 12px}

/* guias das zonas seguras — so p/ conferencia visual, nunca no render final */
.guide{position:absolute;left:0;right:0;z-index:9;background:rgba(239,68,68,0.16);border:2px dashed rgba(239,68,68,0.55)}
.guide.t{top:0;height:var(--safe-top)} .guide.b{bottom:0;height:var(--safe-bot)}
</style>
</head>
<body>
<div class="suits" id="suits"></div>
<div class="arc">
  <svg width="1400" height="1400" viewBox="0 0 1400 1400" fill="none">

/* ---------- construtores de bloco ---------- */
function elVs(b){
  /* O corpo do valor ENCOLHE conforme o comprimento da string. Os 112px foram
     dimensionados pra "50%" (3 chars); com "85,2%" (5 chars) o numero vazava do
     painel e era cortado nos dois lados. Auto-ajuste evita repetir o bug. */
  const vlSize = (v) => { const n = String(v).replace(/<[^>]+>/g,'').length;
    return n <= 3 ? 112 : n === 4 ? 96 : n === 5 ? 82 : 70; };
  const p = (o,hot)=>`<div class="vsp${hot?' hot':''}">
      <span class="lb">${o.lb}</span><span class="vl" style="font-size:${vlSize(o.v)}px${hot?';color:var(--amber)':''}">${o.v}</span>
      <span class="sb">${o.sb||''}</span></div>`;
  return `<div class="vs">${p(b.a,b.aHot)}${b.delta?`<div class="vsmid"><span class="d">${b.delta}</span></div>`:''}${p(b.b,b.bHot)}</div>`;
}
function elBars(b){
  return `<div class="bars">${b.rows.map(r=>`
    <div class="brow">
      <div class="bt"><span class="bsz">${r.sz}</span><span class="bbadge">${r.badge}</span></div>
      <div class="bar"><span class="fill" data-grow="${r.def}" style="width:${r.def}%"></span><span class="mdf" style="left:${r.mdf}%"></span></div>
      <div class="bl"><span>${T.realDefense} <b>${r.defL}</b></span><span>MDF ${r.mdfL}</span></div>
    </div>`).join('')}</div>`;
}
function elStats(b){
  return `<div class="stats">${b.rows.map(r=>`
    <div class="srow"><span class="k">${r.k}</span><span class="v">${r.v}</span></div>`).join('')}</div>`;
}
/* v2: print REAL emoldurado — credibilidade de produto (crop nativo, sem borrao) */
function elShot(b){
  return `<div class="shotwrap">
    <div class="shotframe" style="width:${b.w||900}px">
      ${b.chrome === false ? '' : `<div class="chrome"><span class="dot d1"></span><span class="dot d2"></span><span class="dot d3"></span><span class="ttl">${b.title||'Aura'}</span></div>`}
      <img src="${b.src}">
    </div>
    ${b.cap ? `<div class="shotcap">${b.cap}</div>` : ''}
  </div>`;
}
function elTwoFocus(b){
  return `<div class="twofocus ${b.focus}">
    <div class="main"><img src="${b.src}" alt=""></div>
    <div class="inset"><img src="${b.src}" alt=""></div>
  </div>`;
}
function elGrid(b){
  return '<div class="mgrid' + (b.cols === 1 ? ' one' : '') + '">' + b.cells.map(c =>
    '<div class="mcell"><span class="t">' + c.t + '</span><span class="s">' + c.s + '</span></div>'
  ).join('') + '</div>';
}
const CHROME_BAR = (t) => `<div class="chrome"><span class="dot d1"></span><span class="dot d2"></span><span class="dot d3"></span><span class="ttl">${t}</span></div>`;

function elPreflop(b){
  return `<div class="win">
    ${CHROME_BAR(b.win || 'Aura · Preflop Analysis')}
    <div class="nav"><div class="lg"><span class="i" data-icon></span>AURA</div>
      <div class="tabs"><span class="t on">Preflop</span><span class="t">Postflop</span><span class="t">Hotspot</span></div></div>
    <div class="wbody">
      <div class="ptitle"><span class="n">${b.title}</span><span class="r">${b.right||'▲▼ vs Global'}</span></div>
      <table class="pt">
        <tr><th>${T.action}</th><th>Total</th>${b.cols.map(c=>`<th class="pos">${c}</th>`).join('')}</tr>
        ${b.rows.map(r=>`<tr><td class="a">${r[0]}</td>${r.slice(1).map((c,i)=>
          `<td${b.hi===r[0]&&i>0?' class="hi"':''}>${c}</td>`).join('')}</tr>`).join('')}
      </table>
    </div></div>`;
}
function elPostflop(b){
  return `<div class="win">
    ${CHROME_BAR(b.win || 'Aura · Postflop Analysis')}
    <div class="nav"><div class="lg"><span class="i" data-icon></span>AURA</div>
      <div class="tabs"><span class="t">Preflop</span><span class="t on">Postflop</span><span class="t">Hotspot</span></div></div>
    <div class="wbody">
      <div class="pfhead"><div class="l"><span class="t">${b.head}</span><span class="s">${b.sub}</span></div><span class="v">${b.val}</span></div>
      <div class="sect">${b.sect||T.expSizes}</div>
      <div class="cards">${b.rows.map(r=>`
        <div class="card">
          <div class="top"><span class="sz">${r.sz}</span><span class="badge">${r.badge}</span></div>
          <div class="bar"><span class="fill" style="width:${r.def}%"></span><span class="mdf" style="left:${r.mdf}%"></span></div>
          <div class="lbls"><span>${T.defense} <b>${r.defL}</b></span><span>MDF ${r.mdfL}</span></div>
        </div>`).join('')}</div>
    </div></div>`;
}

  document.body.insertAdjacentHTML('afterbegin',
    `<div class="herobg"><img src="${CONFIG.heroBg}"><span class="tint"></span><span class="veil"></span><span class="focus"></span></div>`);
}

/* ---------- monta a cena ---------- */
const core = document.getElementById("core");
if (CONFIG.cta) {
  core.innerHTML = `<div class="ctaWrap">
      <div class="biglock"><span class="icon" data-icon></span>
        <div style="display:flex;flex-direction:column;align-items:center">
          <span class="wm" data-wordmark></span><span class="tagline">Poker Analytics</span></div></div>
      ${CONFIG.line?`<p class="line" style="margin-top:0">${CONFIG.line}</p>`:''}
      <span class="btn">${CONFIG.ctaBtn||T.ctaBtn}</span>
      ${CONFIG.ctaSub?`<p class="ctasub">${CONFIG.ctaSub}</p>`:''}
    </div>`;
} else {
  core.innerHTML =
    (CONFIG.callout?`<div class="callout">${CONFIG.callout}</div>`:'') +
    (CONFIG.kicker?`<div class="kicker${CONFIG.kickerLg?' lg':''}">${CONFIG.kicker}</div>`:'') +
    (CONFIG.big?`<h1 class="big${CONFIG.bigXs?' sm xs':(CONFIG.bigSm?' sm':'')}">${CONFIG.big}</h1>`:'') +
    (CONFIG.line?`<p class="line">${CONFIG.line}</p>`:'') +
    (CONFIG.block?`<div class="block">${BUILDERS[CONFIG.block.type](CONFIG.block)}</div>`:'');
}
// v2.1: logo grande sobe pro topo da cena (lugar do mark pequeno removido) —
// 1 logo so, nunca mark+herologo empilhados. Ausente em CTA (tem seu proprio lockup).
document.getElementById("toplogo").innerHTML =
  (CONFIG.heroLogo && !CONFIG.cta) ? `<img src="shots/logo-aura-full.png" alt="Aura Poker Analytics">` : '';
document.getElementById("cap").innerHTML = CONFIG.caption || '';
if (!CONFIG.caption) document.getElementById("cap").style.display = 'none';

// v3: selo de prova persistente (vazio => rodape identico ao da v2)
const proofEl = document.getElementById("proof");
if (CONFIG.proof) proofEl.textContent = CONFIG.proof; else proofEl.style.display = 'none';
if (CONFIG.heroFocus) document.body.classList.add('herofocus');

/* ============ v3: ANIMACAO ============
   O build renderiza K frames variando ?a=0..100. Aqui cada frame desenha o
   ESTADO daquele progresso — o video sai da sequencia de PNGs.
   - <n>64,5%</n>  → count-up (respeita virgula PT / ponto EN e as casas decimais)
   - [data-grow]   → barra cresce
   - [data-in="0.55"] → reveal em beat (aparece so depois daquele progresso)   */
(function(){
  const p = CONFIG.anim;
  const ease = 1 - Math.pow(1 - p, 3);           // easeOutCubic: rapido no inicio

  document.querySelectorAll('n').forEach(el => {
    const raw = el.textContent;
    const m = raw.match(/^(\D*?)([\d.,]+)(\D*)$/);
    if (!m) return;
    const [, pre, numS, suf] = m;
    const ptDec = numS.includes(',');                       // 64,5 (PT) vs 64.5 (EN)
    const dec = (numS.split(/[.,]/)[1] || '').length;
    /* So trate o ponto como separador de MILHAR quando a virgula for o decimal
       (PT). Em EN o ponto E o decimal — remove-lo virava 57.7 em 577. */
    const val = parseFloat(ptDec ? numS.replace(/\./g, '').replace(',', '.') : numS);
    if (isNaN(val)) return;
    /* count-up parte de 72% do valor, nao de zero. Com corte seco o primeiro
       frame da cena fica TOTALMENTE visivel — comecar em zero colocava
       "Fold vs RFI 0%" na tela, que e um numero falso. Assim le como
       assentamento rapido e nunca exibe um valor absurdo. */
    let s = (val * (0.72 + 0.28 * ease)).toFixed(dec);
    if (ptDec) s = s.replace('.', ',');
    el.textContent = pre + s + suf;
  });

  document.querySelectorAll('[data-grow]').forEach(el => {
    el.style.width = (parseFloat(el.getAttribute('data-grow')) * ease).toFixed(2) + '%';
  });

  // reveal suave: cada frame desenha um estagio da entrada (screenshot nao
  // captura transition CSS, entao a interpolacao tem que ser calculada aqui)
  document.querySelectorAll('[data-in]').forEach(el => {
    const t0 = parseFloat(el.getAttribute('data-in'));
    const k = Math.max(0, Math.min(1, (p - t0) / 0.25));
    el.style.opacity = k;
    el.style.transform = `translateY(${((1 - k) * 16).toFixed(1)}px)`;
  });
})();

document.querySelectorAll("[data-icon]").forEach(el=>el.innerHTML=ICON_SVG);
document.querySelectorAll("[data-wordmark]").forEach(el=>el.innerHTML=WORDMARK_SVG);

if (CONFIG.guides) {
  document.body.insertAdjacentHTML('beforeend','<div class="guide t"></div><div class="guide b"></div>');
}
