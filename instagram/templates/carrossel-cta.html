<style>
@font-face {
  font-family: "Montserrat";
  src: url("fonts/Montserrat-Variable-latin.woff2") format("woff2");
  font-weight: 100 900;
  font-display: block;
}
:root {
  --bg: #020617;
  --navy: #0F1526;
  --surface2: #1E293B;
  --amber: #FBBF24;
  --amber3: #FCD34D;
  --amber6: #D97706;
  --gold: #D4A418;
  --ink: #FFFFFF;
  --ink-soft: #CBD5E1;
  --ink-dim: #64748B;
  --pad: 84px;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 1080px; height: 100vh; overflow: hidden; }
body {
  font-family: "Montserrat", "Segoe UI", sans-serif;
  color: var(--ink);
  background:
    radial-gradient(1300px 1000px at 50% 26%, rgba(34, 53, 89, 0.6), transparent 64%),
    radial-gradient(1000px 760px at 50% 116%, rgba(212, 164, 24, 0.15), transparent 60%),
    var(--bg);
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 72px var(--pad) 56px;
  text-align: center;
}
.suits { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
.suits span { position: absolute; font-family: "Segoe UI Symbol", "Segoe UI", sans-serif; color: rgba(251, 191, 36, 0.04); user-select: none; }
.arc { position: absolute; top: 46%; left: 50%; transform: translate(-50%, -50%); pointer-events: none; filter: drop-shadow(0 0 24px rgba(212, 164, 24, 0.3)); }
.vignette { position: absolute; inset: 0; pointer-events: none; background: radial-gradient(1500px 1250px at 50% 45%, transparent 55%, rgba(2, 6, 23, 0.5) 100%); }

.main { position: relative; z-index: 3; flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; }
.full-logo { width: 400px; color: var(--gold); filter: drop-shadow(0 0 70px rgba(212, 164, 24, 0.35)) drop-shadow(0 10px 30px rgba(0, 0, 0, 0.5)); }
.full-logo svg { width: 100%; height: auto; display: block; }
.headline { margin-top: 68px; font-size: 86px; font-weight: 900; line-height: 1.1; text-transform: uppercase; max-width: 900px; }
.headline em {
  font-style: normal;
  background: linear-gradient(180deg, var(--amber3) 0%, var(--amber) 45%, var(--amber6) 100%);
  -webkit-background-clip: text; background-clip: text; color: transparent;
}
.bullets { margin-top: 48px; display: flex; flex-direction: column; gap: 22px; align-items: flex-start; }
.bullet { display: flex; align-items: center; gap: 20px; font-size: 32px; font-weight: 500; color: var(--ink-soft); }
.bullet .mark {
  flex: none; width: 40px; height: 40px; border-radius: 12px;
  display: flex; align-items: center; justify-content: center;
  background: rgba(251, 191, 36, 0.12); border: 1.5px solid rgba(251, 191, 36, 0.4);
  color: var(--amber); font-size: 21px;
}
.cta {
  margin-top: 62px;
  display: inline-block;
  font-size: 40px; font-weight: 900; letter-spacing: 0.06em; text-transform: uppercase;
  color: var(--navy);
  background: linear-gradient(180deg, var(--amber3), var(--amber6));
  border-radius: 999px; padding: 36px 80px;
  box-shadow: 0 18px 70px rgba(245, 158, 11, 0.4), inset 0 2px 0 rgba(255, 255, 255, 0.35);
}
.cta-sub { margin-top: 26px; font-size: 27px; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase; color: var(--ink-dim); }
.cta-sub::before { content: "↗ "; color: var(--amber); }

footer { position: relative; z-index: 3; width: 100%; display: flex; align-items: center; justify-content: space-between; border-top: 2px solid rgba(30, 41, 59, 0.9); padding-top: 28px; }
.tagline { font-size: 21px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--gold); white-space: nowrap; }
.right { display: flex; align-items: center; gap: 24px; }
.handle { font-size: 22px; font-weight: 600; color: var(--ink-dim); letter-spacing: 0.04em; }
.age { font-size: 22px; font-weight: 800; color: var(--ink-dim); border: 3px solid var(--ink-dim); border-radius: 11px; padding: 6px 12px; }
</style>

(function () {
  const host = document.getElementById("suits");
  const suits = ["♠", "♣", "♦", "♥"];
  const step = 168;
  let i = 0;
  for (let y = -40; y < 1500; y += step) {
    for (let x = -40; x < 1160; x += step) {
      const s = document.createElement("span");
      s.textContent = suits[i % 4];
      s.style.left = (x + ((Math.floor(y / step) % 2) ? step / 2 : 0)) + "px";
      s.style.top = y + "px";
      s.style.fontSize = (34 + (i * 29) % 18) + "px";
      s.style.transform = `rotate(${(i * 53) % 40 - 20}deg)`;
      host.appendChild(s);
      i++;
    }
  }
})();

document.getElementById("ctaSub").textContent = CONFIG.ctaSub;
document.getElementById("handle").textContent = CONFIG.handle;
document.getElementById("tagline").textContent = CONFIG.tagline;

const bullets = document.getElementById("bullets");
CONFIG.bullets.forEach(b => {
  const div = document.createElement("div");
  div.className = "bullet";
  div.innerHTML = `<span class="mark">♠</span><span>${b}</span>`;
  bullets.appendChild(div);
});
</script>
</body>
</html>
