<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Aura · stat-card</title>
<script>
/* ============================================================
   STAT CARD — pilar P1 (em espera até números de solver)
   1080×1350 (feed) · 1080×1920 (story — mesmo arquivo)
   Edite apenas o CONFIG.
   ============================================================ */
const CONFIG = {
  context: "MTT · BB vs BTN · single-raised pot",
  action: "fold",                       // "fold" | "call" | "raise" | ""
  statValue: "68%",
  statLabel: "of the pool folds to a flop c-bet",
  read: "GTO folds far less here. Against this pool, your small c-bet prints — bet more flops.",
  footerSample: "Aura · amostra de 12.4M mãos",
  handle: "@aurapokeranalytics",
};
</script>
<style>
@font-face {
  font-family: "Montserrat";
  src: url("fonts/Montserrat-Variable-latin.woff2") format("woff2");
  font-weight: 100 900;
  font-display: block;
}
:root {
  --bg: #020617;
  --surface: #0F172A;
  --surface2: #1E293B;
  --amber: #FBBF24;
  --amber3: #FCD34D;
  --amber6: #D97706;
  --gold: #D4A418;
  --fold: #015A6B;
  --call: #348A5D;
  --raise: #AD2C34;
  --ink: #FFFFFF;
  --ink-soft: #CBD5E1;
  --ink-dim: #64748B;
  --pad: 84px;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 1080px; height: 100vh; overflow: hidden; }
body {
  font-family: "Montserrat", "Segoe UI", sans-serif;
  color: var(--ink);
  background:
    radial-gradient(1300px 900px at 50% -12%, rgba(34, 53, 89, 0.58), transparent 62%),
    radial-gradient(1000px 760px at 88% 112%, rgba(212, 164, 24, 0.1), transparent 60%),
    var(--bg);
  position: relative;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  padding: 64px var(--pad);
}
.suits { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
.suits span { position: absolute; font-family: "Segoe UI Symbol", "Segoe UI", sans-serif; color: rgba(251, 191, 36, 0.04); user-select: none; }
.arc { position: absolute; top: -820px; right: -680px; pointer-events: none; filter: drop-shadow(0 0 24px rgba(212, 164, 24, 0.3)); }

header { display: flex; justify-content: space-between; align-items: center; position: relative; z-index: 3; }
.lockup { display: flex; align-items: center; gap: 20px; }
.lockup .icon { width: 56px; height: 46px; color: var(--gold); }
.lockup .icon svg, .lockup .wm svg { width: 100%; height: 100%; display: block; }
.lockup .wm { width: 168px; color: var(--gold); }
.handle { font-size: 24px; font-weight: 600; color: var(--ink-dim); letter-spacing: 0.05em; }

.context-row { display: flex; align-items: center; gap: 18px; margin-top: 46px; position: relative; z-index: 3; }
.context {
  display: inline-block; white-space: nowrap;
  font-size: 25px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase;
  color: var(--ink-soft);
  border: 2px solid rgba(148, 163, 184, 0.25); background: rgba(15, 23, 42, 0.6);
  border-radius: 999px; padding: 16px 34px;
}
.action-chip {
  display: inline-block;
  font-size: 25px; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase;
  color: #fff; border-radius: 999px; padding: 18px 34px;
}
.action-chip.fold  { background: var(--fold); }
.action-chip.call  { background: var(--call); }
.action-chip.raise { background: var(--raise); }
.action-chip.hidden { display: none; }

.stat-block { position: relative; z-index: 3; }
.stat-value {
  font-size: 380px; font-weight: 900; line-height: 0.96; letter-spacing: -0.03em;
  background: linear-gradient(180deg, var(--amber3) 0%, var(--amber) 45%, var(--amber6) 100%);
  -webkit-background-clip: text; background-clip: text; color: transparent;
  filter: drop-shadow(0 0 70px rgba(251, 191, 36, 0.22));
  font-variant-numeric: tabular-nums;
}
.stat-label {
  margin-top: 24px;
  font-size: 44px; font-weight: 800; letter-spacing: 0.07em; text-transform: uppercase;
  color: var(--ink); max-width: 900px; line-height: 1.28;
}
.read {
  margin-top: 46px; max-width: 880px;
  font-size: 33px; font-weight: 500; line-height: 1.5; color: var(--ink-soft);
  background: rgba(15, 23, 42, 0.65);
  border: 1px solid rgba(251, 191, 36, 0.18);
  border-left: 6px solid var(--amber);
  border-radius: 0 20px 20px 0;
  padding: 28px 36px;
}

footer { position: relative; z-index: 3; display: flex; align-items: center; justify-content: space-between; border-top: 2px solid rgba(30, 41, 59, 0.9); padding-top: 30px; }
.sample { display: flex; align-items: center; gap: 16px; font-size: 24px; font-weight: 600; color: var(--ink-dim); letter-spacing: 0.04em; }
.sample .icon { width: 42px; height: 34px; color: var(--gold); opacity: 0.95; }
.sample .icon svg { width: 100%; height: 100%; }
.age { font-size: 22px; font-weight: 800; color: var(--ink-dim); border: 3px solid var(--ink-dim); border-radius: 11px; padding: 6px 12px; }
</style>
</head>
<body>

<div class="suits" id="suits"></div>
<div class="arc">
  <svg width="1400" height="1400" viewBox="0 0 1400 1400" fill="none">
    <circle cx="700" cy="700" r="650" stroke="url(#arcGrad)" stroke-width="3" stroke-linecap="round"
      stroke-dasharray="3000 1084" transform="rotate(96 700 700)"/>
    <defs>
      <linearGradient id="arcGrad" x1="0" y1="0" x2="1400" y2="1400">
        <stop offset="0" stop-color="#FCD34D"/><stop offset="0.55" stop-color="#D4A418"/><stop offset="1" stop-color="#6B520C"/>
      </linearGradient>
    </defs>
  </svg>
</div>

<header>
  <div class="lockup"><span class="icon" data-icon></span><span class="wm" data-wordmark></span></div>
  <span class="handle" id="handle"></span>
</header>

<div class="context-row">
  <span class="context" id="context"></span>
  <span class="action-chip" id="action"></span>
</div>

<div class="stat-block">
  <div class="stat-value" id="statValue"></div>
  <div class="stat-label" id="statLabel"></div>
  <div class="read" id="read"></div>
</div>

<footer>
  <div class="sample"><span class="icon" data-icon></span><span id="footerSample"></span></div>
  <span class="age">18+</span>
</footer>

const WORDMARK_SVG = `<svg viewBox="1 204 594 129" fill="currentColor" xmlns="http://www.w3.org/2000/svg">${AURA_LETTERS}</svg>`;

document.querySelectorAll("[data-icon]").forEach(el => el.innerHTML = ICON_SVG);
document.querySelectorAll("[data-wordmark]").forEach(el => el.innerHTML = WORDMARK_SVG);

(function () {
  const host = document.getElementById("suits");
  const suits = ["♠", "♣", "♦", "♥"];
  const step = 168;
  let i = 0;
  for (let y = -40; y < 2000; y += step) {
    for (let x = -40; x < 1160; x += step) {
      const s = document.createElement("span");
      s.textContent = suits[i % 4];
      s.style.left = (x + ((Math.floor(y / step) % 2) ? step / 2 : 0)) + "px";
      s.style.top = y + "px";
      s.style.fontSize = (34 + (i * 29) % 18) + "px";
      s.style.transform = `rotate(${(i * 53) % 40 - 20}deg)`;
      host.appendChild(s);
      i++;
    }
  }
})();

document.getElementById("context").textContent = CONFIG.context;
document.getElementById("statValue").textContent = CONFIG.statValue;
document.getElementById("statLabel").textContent = CONFIG.statLabel;
document.getElementById("read").textContent = CONFIG.read;
document.getElementById("footerSample").textContent = CONFIG.footerSample;
document.getElementById("handle").textContent = CONFIG.handle;

const chip = document.getElementById("action");
if (CONFIG.action && ["fold", "call", "raise"].includes(CONFIG.action)) {
  chip.textContent = CONFIG.action;
  chip.classList.add(CONFIG.action);
} else {
  chip.classList.add("hidden");
}
</script>
</body>
</html>
