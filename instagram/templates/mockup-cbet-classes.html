<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Aura · mockup Flop CBet IP por classe</title>
<style>
/* ============================================================
   MOCKUP — Flop CBet IP, breakdown por PLAYER TYPE (Reg Aggro x Reg Tight).
   RECRIADO em HTML/CSS, nao e captura. O print oficial nao chegou; o brief
   autoriza recriar com "fidelidade total a UI".

   Gramatica copiada da tela real (aura-total2.png / postflop-ref.png):
   - cabecalho de coluna: titulo ambar + borda lateral ambar
   - linha da acao ATIVA: painel marrom-avermelhado, chevron, nome em bold,
     barra fina ambar sobre trilho slate, % em bold a direita, "N hands" abaixo
   - rail de contexto ativo em ambar
   Labels em INGLES porque a UI do produto e em ingles (auta-total/aura-total2)
   — o mesmo asset serve aos reels PT e EN.

   ⚠️ Nada inventado: a UI real NAO calcula "gap" entre colunas de breakdown,
   entao o 7,6 pp NAO aparece aqui. Ele vive na nossa data-viz (cena 1 do
   reel), nao dentro do print.

   DADO OFICIAL (validado no banco, nao alterar):
   Reg Aggro 85,2% n=2.399.253 · Reg Tight 77,6% n=804.261 · gap 7,6 pp
   ============================================================ */
@font-face{font-family:"Montserrat";src:url("fonts/Montserrat-Variable-latin.woff2") format("woff2");font-weight:100 900;font-display:block}
:root{
  --bg:#020617; --panel:#0B1220; --panel2:#0F1626;
  --slate:#1E2A40; --slate2:#28374F;
  --ink:#E7EDF7; --ink-soft:#93A4BF; --ink-dim:#64748B;
  --amber:#FBBF24; --gold:#D4A418;
}
*{margin:0;padding:0;box-sizing:border-box}
/* canvas justo a janela: o asset entra DENTRO de moldura no reel, entao
   margem propria vira moldura duplicada e encolhe o painel */
html,body{width:1180px;height:500px;overflow:hidden}
body{font-family:"Montserrat","Segoe UI",sans-serif;background:var(--bg);
  display:flex;align-items:center;justify-content:center}

.win{width:1120px;border-radius:22px;overflow:hidden;background:var(--panel);
  border:1px solid rgba(148,163,184,0.10);
  box-shadow:0 46px 110px rgba(0,0,0,0.66), inset 0 1px 0 rgba(255,255,255,0.04)}

/* chrome de janela */
.chrome{display:flex;align-items:center;gap:10px;padding:14px 20px;background:#0A1120;
  border-bottom:1px solid var(--slate)}
.dot{width:12px;height:12px;border-radius:50%}
.d1{background:#F87171}.d2{background:#FBBF24}.d3{background:#34D399}
.url{margin-left:16px;font-size:17px;color:var(--ink-dim);background:rgba(148,163,184,0.10);
  border-radius:999px;padding:5px 20px}

/* nav do app */
.nav{display:flex;align-items:center;gap:20px;padding:15px 26px;border-bottom:1px solid var(--slate);
  background:#0C1424}
.lg{display:flex;align-items:center;gap:9px;color:var(--gold);font-weight:800;font-size:21px;letter-spacing:0.04em}
.lg .i{width:26px;height:21px;color:var(--gold)}
.lg .i svg{width:100%;height:100%;display:block}
.tab{font-size:17px;font-weight:600;color:var(--ink-dim);padding:8px 16px;border-radius:9px}
.tab.on{color:#0F1526;font-weight:800;background:var(--amber)}

.body{padding:22px 26px 26px}

/* rail de contexto ativo (ambar, como na tela real) */
.ctx{border:1px solid var(--slate2);border-radius:12px;padding:13px 18px;margin-bottom:20px}
.ctx .lbl{font-size:12px;font-weight:700;letter-spacing:0.16em;color:var(--ink-dim);margin-bottom:6px}
.ctx .val{font-size:16px;font-weight:700;color:var(--amber);line-height:1.4}

.bk{font-size:12px;font-weight:800;letter-spacing:0.18em;color:var(--ink-dim);margin-bottom:14px}

/* duas colunas de breakdown lado a lado */
.cols{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.col{border:1px solid var(--slate);border-radius:14px;overflow:hidden;background:var(--panel2)}
.colhead{background:rgba(148,163,184,0.06);border-left:3px solid var(--amber);
  padding:12px 18px;font-size:19px;font-weight:800;color:var(--amber)}
.colbody{padding:18px}

/* linha da acao ATIVA — mesmo tratamento marrom-avermelhado da tela real */
.act{background:linear-gradient(180deg,rgba(120,20,20,0.35),rgba(60,12,12,0.15));
  border:1px solid rgba(153,27,27,0.40);border-radius:12px;padding:15px 16px}
.arow{display:flex;align-items:center;gap:11px}
.chev{color:var(--ink-dim);font-size:14px;flex:none}
.aname{font-size:18px;font-weight:800;color:#F1F5F9;white-space:nowrap}
.track{flex:1;height:9px;border-radius:999px;background:rgba(148,163,184,0.14);overflow:hidden;min-width:36px}
/* display:block obrigatorio — span inline ignora width e a barra some */
.fill{display:block;height:100%;border-radius:999px;background:var(--amber)}
.pct{flex:none;font-size:23px;font-weight:900;color:#fff;font-variant-numeric:tabular-nums}
.hands{margin-top:8px;margin-left:25px;font-size:15px;font-weight:600;color:var(--ink-dim)}
</style>
</head>
<body>
<div class="win">
  <div class="chrome"><span class="dot d1"></span><span class="dot d2"></span><span class="dot d3"></span>
    <span class="url">aurapoker.com</span></div>

  <div class="nav">
    <div class="lg"><span class="i" data-icon></span>AURA</div>
    <span class="tab">Preflop</span><span class="tab on">Postflop</span><span class="tab">Hotspot</span>
  </div>

  <div class="body">
    <div class="ctx">
      <div class="lbl">ACTIVE CONTEXT</div>
      <div class="val">SRP · All Tournaments · Any Stage · Any Buy-in · RFI: EP · Caller: BB · Last 2 Years</div>
    </div>

    <div class="bk">BREAKDOWN · PLAYER TYPE</div>

    <div class="cols">
      <div class="col">
        <div class="colhead">Reg Aggro</div>
        <div class="colbody">
          <div class="act">
            <div class="arow"><span class="chev">&#9662;</span><span class="aname">Flop CBet IP</span>
              <span class="track"><span class="fill" style="width:85.2%"></span></span>
              <span class="pct">85.2%</span></div>
            <div class="hands">2.4M hands</div>
          </div>
        </div>
      </div>

      <div class="col">
        <div class="colhead">Reg Tight</div>
        <div class="colbody">
          <div class="act">
            <div class="arow"><span class="chev">&#9662;</span><span class="aname">Flop CBet IP</span>
              <span class="track"><span class="fill" style="width:77.6%"></span></span>
              <span class="pct">77.6%</span></div>
            <div class="hands">804K hands</div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

/* ?bare=1 => fundo transparente (o asset entra DENTRO de moldura no reel;
   com fundo proprio aparecem retangulos aninhados) */
if (new URLSearchParams(location.search).get('bare')) document.body.style.background = 'transparent';
</script>
</body>
</html>
