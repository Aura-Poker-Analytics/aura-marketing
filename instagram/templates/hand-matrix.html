<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<script src="deck.js"></script>
<title>Aura · hand-matrix</title>
<script>
/* ============================================================
   HAND MATRIX — grade 13x13 estilo poker (heatmap de frequência)
   1080×1350 · Herói nativo de poker para Preflop/RFI.
   Layout em 2 colunas: grade dominante à esquerda,
   texto + legenda + bullets horizontais embaixo — bem
   diferente do padrão card-frame + bullets verticais.
   Edite apenas o CONFIG.
   ============================================================ */
const CONFIG = {
  kicker: "Preflop Analysis · RFI",
  titleHtml: "The field opens <em>too wide</em>",
  sub: "Open-raise frequency by hand, CO position, whole pool — 500M+ hands.",

  // eixo de referência mostrado no canto da grade
  positionLabel: "CO · Raise first in",

  // escala de cor (extremos do gradiente)
  legendLow: "Rare",
  legendHigh: "Wide open",

  // "temperatura" geral da grade — 0 (tight) a 1 (loose). Não mude os mocks de outros templates;
  // este número é o mock ilustrativo deste template.
  poolTightness: 0.62,

  // mãos destacadas com anel + callout (códigos padrão: par "77", suited "A5s", offsuit "K9o")
  highlightHands: ["A5s", "A4s", "A3s", "K9o", "K8o", "Q9o"],
  calloutLabel: "+18 pts vs reference",

  // exatamente 3 bullets horizontais — <b> destaca o lead
  bullets: [
    "<b>169-hand grid</b> — every combo, not a summary.",
    "<b>Any position</b> — filter RFI, 3-bet, defense by seat.",
    "<b>Free to start</b> — Preflop sample included, no card.",
  ],

  footerNote: "aura.poker",
};
(function(){try{var id=new URLSearchParams(location.search).get('p');if(id&&window.DECK&&window.DECK[id])Object.assign(CONFIG,window.DECK[id]);}catch(e){}})();
</script>
<style>
@font-face {
  font-family: "Montserrat";
  src: url("fonts/Montserrat-Variable-latin.woff2") format("woff2");
  font-weight: 100 900;
  font-display: block;
}
:root {
  --bg: #020617;
  --surface: #0F172A;
  --surface2: #1E293B;
  --amber: #FBBF24;
  --amber3: #FCD34D;
  --amber6: #D97706;
  --gold: #D4A418;
  --red: #EF4444;
  --red-deep: #7F1D1D;
  --cold: #1E293B;
  --ink: #FFFFFF;
  --ink-soft: #CBD5E1;
  --ink-dim: #64748B;
  --pad: 84px;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 1080px; height: 100vh; overflow: hidden; }
body {
  font-family: "Montserrat", "Segoe UI", sans-serif;
  color: var(--ink);
  background:
    radial-gradient(1200px 800px at 8% -10%, rgba(34, 53, 89, 0.55), transparent 60%),
    radial-gradient(1000px 800px at 104% 108%, rgba(212, 164, 24, 0.12), transparent 58%),
    var(--bg);
  position: relative;
  display: flex;
  flex-direction: column;
  padding: 60px var(--pad) 48px;
}
.suits { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
.suits span { position: absolute; font-family: "Segoe UI Symbol", "Segoe UI", sans-serif; color: rgba(251, 191, 36, 0.035); user-select: none; }
.arc { position: absolute; top: -900px; right: -760px; pointer-events: none; filter: drop-shadow(0 0 22px rgba(212, 164, 24, 0.28)); }

/* ---------- header ---------- */
.head { position: relative; z-index: 3; display: flex; align-items: flex-start; justify-content: space-between; gap: 40px; }
.head-text { flex: 1; min-width: 0; }
.kicker { font-size: 22px; font-weight: 800; letter-spacing: 0.2em; text-transform: uppercase; color: var(--amber); }
.kicker::before { content: ""; display: inline-block; width: 42px; height: 4px; background: var(--amber); border-radius: 2px; vertical-align: middle; margin-right: 18px; }
.title { margin-top: 14px; font-size: 46px; font-weight: 900; line-height: 1.1; text-transform: uppercase; max-width: 820px; }
.title em {
  font-style: normal;
  background: linear-gradient(180deg, var(--amber3) 0%, var(--amber) 45%, var(--amber6) 100%);
  -webkit-background-clip: text; background-clip: text; color: transparent;
}
.sub { margin-top: 12px; font-size: 21px; font-weight: 500; line-height: 1.4; color: var(--ink-soft); max-width: 760px; }

/* ---------- matrix hero ---------- */
.matrix-wrap { position: relative; z-index: 3; margin-top: 24px; flex: 1; display: flex; align-items: center; justify-content: center; min-height: 0; }
.matrix-card {
  position: relative;
  background: rgba(9, 14, 28, 0.72);
  border: 1.5px solid rgba(251, 191, 36, 0.18);
  border-radius: 24px;
  padding: 26px 28px 22px;
  box-shadow: 0 40px 110px rgba(0, 0, 0, 0.65), inset 0 1px 0 rgba(255, 255, 255, 0.04);
}
.matrix-toprow { display: flex; align-items: center; justify-content: space-between; margin-bottom: 13px; padding: 0 4px; }
.pos-chip {
  font-size: 17px; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase;
  color: var(--amber); background: rgba(251, 191, 36, 0.1); border: 1.5px solid rgba(251, 191, 36, 0.35);
  border-radius: 999px; padding: 7px 18px;
}
.scale { display: flex; align-items: center; gap: 10px; }
.scale-label { font-size: 15px; font-weight: 700; color: var(--ink-dim); letter-spacing: 0.03em; }
.scale-bar { width: 130px; height: 11px; border-radius: 999px; background: linear-gradient(90deg, var(--cold), var(--amber6) 45%, var(--amber) 68%, var(--red) 100%); border: 1px solid rgba(255,255,255,0.08); }

.grid-body { display: flex; gap: 11px; }
.rank-col { display: flex; flex-direction: column; gap: 3px; padding-top: 3px; }
.rank-col span { height: 40px; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 800; color: var(--ink-dim); width: 26px; }
.grid-main { display: flex; flex-direction: column; gap: 3px; }
.rank-row-top { display: flex; gap: 3px; margin-left: 0; margin-bottom: 1px; }
.rank-row-top span { width: 40px; text-align: center; font-size: 15px; font-weight: 800; color: var(--ink-dim); }
.grid { display: grid; grid-template-columns: repeat(13, 40px); grid-template-rows: repeat(13, 40px); gap: 3px; position: relative; }
.cell {
  border-radius: 7px;
  display: flex; align-items: center; justify-content: center;
  font-size: 13px; font-weight: 800; color: rgba(2, 6, 23, 0.72);
  position: relative;
}
.cell.pair { border: 1.5px solid rgba(255,255,255,0.16); }
.cell .hl-ring {
  position: absolute; inset: -3px; border-radius: 10px;
  border: 2.5px dashed var(--red);
  box-shadow: 0 0 14px rgba(239, 68, 68, 0.55);
}

/* ---------- callout ---------- */
.callout {
  position: absolute;
  display: flex; align-items: center; gap: 10px;
  background: linear-gradient(135deg, var(--red), #B91C1C);
  color: #fff; font-size: 18px; font-weight: 800; letter-spacing: 0.02em;
  border-radius: 12px; padding: 10px 18px;
  box-shadow: 0 14px 34px rgba(239, 68, 68, 0.4);
  white-space: nowrap;
}
.callout::before { content: "▲"; font-size: 13px; }

/* ---------- bullets horizontais ---------- */
.bullets { position: relative; z-index: 3; margin-top: 24px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 22px; }
.bullet { display: flex; flex-direction: column; gap: 8px; }
.bullet .marker {
  flex: none; width: 38px; height: 38px; border-radius: 11px;
  display: flex; align-items: center; justify-content: center;
  background: rgba(251, 191, 36, 0.12); border: 1.5px solid rgba(251, 191, 36, 0.4);
  color: var(--amber); font-size: 20px; font-weight: 900;
}
.bullet .text { font-size: 19px; font-weight: 500; line-height: 1.36; color: var(--ink-soft); }
.bullet .text b { color: var(--ink); font-weight: 800; }

footer { position: relative; z-index: 3; margin-top: 22px; display: flex; align-items: center; justify-content: space-between; border-top: 2px solid rgba(30, 41, 59, 0.9); padding-top: 20px; }
.note { display: flex; align-items: center; gap: 14px; font-size: 21px; font-weight: 600; color: var(--ink-dim); letter-spacing: 0.05em; }
.note .icon { width: 36px; height: 30px; color: var(--gold); opacity: 0.95; }
.note .icon svg { width: 100%; height: 100%; }
.age { font-size: 19px; font-weight: 800; color: var(--ink-dim); border: 3px solid var(--ink-dim); border-radius: 11px; padding: 5px 11px; }
</style>
</head>
<body>

<div class="suits" id="suits"></div>
<div class="arc">
  <svg width="1300" height="1300" viewBox="0 0 1300 1300" fill="none">
    <circle cx="650" cy="650" r="600" stroke="url(#arcGrad)" stroke-width="3" stroke-linecap="round"
      stroke-dasharray="2800 1000" transform="rotate(200 650 650)"/>
    <defs>
      <linearGradient id="arcGrad" x1="0" y1="0" x2="1300" y2="1300">
        <stop offset="0" stop-color="#FCD34D"/><stop offset="0.55" stop-color="#D4A418"/><stop offset="1" stop-color="#6B520C"/>
      </linearGradient>
    </defs>
  </svg>
</div>

<div class="head">
  <div class="head-text">
    <div class="kicker" id="kicker"></div>
    <h1 class="title" id="title"></h1>
    <p class="sub" id="sub"></p>
  </div>
</div>

<div class="matrix-wrap">
  <div class="matrix-card">
    <div class="matrix-toprow">
      <span class="pos-chip" id="posChip"></span>
      <div class="scale">
        <span class="scale-label" id="legendLow"></span>
        <span class="scale-bar"></span>
        <span class="scale-label" id="legendHigh"></span>
      </div>
    </div>
    <div class="grid-body">
      <div class="rank-col" id="rankCol"></div>
      <div class="grid-main">
        <div class="rank-row-top" id="rankRowTop"></div>
        <div class="grid" id="grid"></div>
      </div>
    </div>
  </div>
</div>

<div class="bullets" id="bullets"></div>

<footer>
  <div class="note"><span class="icon" data-icon></span><span id="footerNote"></span></div>
  <span class="age">18+</span>
</footer>

<script>
const ICON_PATHS = `<path d="M5.86165 44.898C-5.49315 30.408 0.312736 8.78736 17.5518 1.99342C24.4945 -0.786314 32.5783 -0.656823 39.4165 2.36894C53.1363 8.26508 59.687 24.4384 54.0901 38.1515C53.1232 40.5643 51.8035 42.8347 50.2094 44.8936L49.874 44.6347C50.1658 44.0476 50.4577 43.4736 50.7277 42.8909C54.5649 34.7459 54.4429 24.8226 49.8784 17.1481C42.8921 5.2091 27.6609 0.935911 15.5352 7.87661C3.92345 14.5022 -0.305745 28.8843 4.59855 41.1298C4.81633 41.7039 5.0733 42.3427 5.33899 42.8952C5.60903 43.4779 5.90085 44.052 6.19267 44.639L5.85729 44.898H5.86165Z"/>
<path d="M28.0486 8.56287C22.2601 20.394 16.4717 32.2251 10.6788 44.0562C12.3905 42.8477 14.9734 41.2895 18.3837 40.1456C19.612 39.7312 22.0293 39.0147 25.2219 38.7212C25.5964 38.5529 26.093 38.2637 26.5285 37.7759C27.012 37.2364 27.1949 36.7055 27.3604 36.2005C27.4519 35.9285 27.5521 35.5573 27.613 35.0998C27.6479 34.8279 27.2777 34.6941 27.1122 34.9185C26.8595 35.2681 26.498 35.635 25.9884 35.9199C25.714 36.071 25.0215 36.4465 24.0807 36.3688C23.031 36.2868 22.3647 35.6955 22.173 35.5228C21.132 34.5775 21.1059 33.2869 21.1016 32.933C21.0798 31.7028 21.6591 30.6885 23.0093 29.0526C24.0894 27.7404 25.7315 25.975 28.0268 24.1017C30.3439 25.975 31.9903 27.7447 33.0748 29.0526C34.4294 30.6928 35.0043 31.7115 34.9825 32.933C34.9782 33.2869 34.9521 34.5775 33.9111 35.5228C33.7238 35.6955 33.0531 36.2825 32.0034 36.3688C31.0626 36.4422 30.3744 36.071 30.0957 35.9199C29.5861 35.635 29.2246 35.2725 28.9719 34.9185C28.8108 34.6941 28.4362 34.8279 28.4711 35.0998C28.532 35.5573 28.6366 35.9285 28.7237 36.2005C28.8936 36.7055 29.0765 37.2364 29.5556 37.7759C29.9911 38.2637 30.4877 38.5529 30.8622 38.7212C34.0548 39.0147 36.4678 39.7356 37.6917 40.1456C41.1064 41.2938 43.6936 42.8477 45.4053 44.0606C39.6168 32.2294 33.8283 20.3983 28.0355 8.56718L28.0486 8.56287Z"/>`;
const ICON_SVG = `<svg viewBox="0 0 60 45" fill="currentColor" xmlns="http://www.w3.org/2000/svg">${ICON_PATHS}</svg>`;
document.querySelectorAll("[data-icon]").forEach(el => el.innerHTML = ICON_SVG);

/* ---- marca d'água de naipes ---- */
(function () {
  const host = document.getElementById("suits");
  const suits = ["♠", "♣", "♦", "♥"];
  const step = 168;
  let i = 0;
  for (let y = -40; y < 1500; y += step) {
    for (let x = -40; x < 1160; x += step) {
      const s = document.createElement("span");
      s.textContent = suits[i % 4];
      s.style.left = (x + ((Math.floor(y / step) % 2) ? step / 2 : 0)) + "px";
      s.style.top = y + "px";
      s.style.fontSize = (34 + (i * 29) % 18) + "px";
      s.style.transform = `rotate(${(i * 53) % 40 - 20}deg)`;
      host.appendChild(s);
      i++;
    }
  }
})();

/* ---- texto ---- */
document.getElementById("kicker").textContent = CONFIG.kicker;
document.getElementById("title").innerHTML = CONFIG.titleHtml;
document.getElementById("sub").textContent = CONFIG.sub;
document.getElementById("posChip").textContent = CONFIG.positionLabel;
document.getElementById("legendLow").textContent = CONFIG.legendLow;
document.getElementById("legendHigh").textContent = CONFIG.legendHigh;
document.getElementById("footerNote").textContent = CONFIG.footerNote;

/* ============================================================
   Grade 13x13 — convenção padrão de hand chart:
   ranks[0..12] = A K Q J T 9 8 7 6 5 4 3 2
   linha i, coluna j:
     i === j  -> par (ex.: AA, 77)
     i < j    -> suited  (linha = rank alto, o rank mais alto primeiro na tabela)
     i > j    -> offsuit
   Frequência gerada por uma força de mão aproximada (Chen-like),
   modulada por CONFIG.poolTightness, com overrides nas mãos de
   CONFIG.highlightHands para simular o leak (o field abre demais ali).
   ============================================================ */
const RANKS = ["A","K","Q","J","T","9","8","7","6","5","4","3","2"];
const RANK_VAL = { A:14,K:13,Q:12,J:11,T:10,9:9,8:8,7:7,6:6,5:5,4:4,3:3,2:2 };

function handCode(i, j) {
  const hi = RANKS[Math.min(i, j)], lo = RANKS[Math.max(i, j)];
  if (i === j) return hi + hi;
  return hi + lo + (i < j ? "s" : "o");
}

function baseStrength(i, j) {
  const a = RANK_VAL[RANKS[i]], b = RANK_VAL[RANKS[j]];
  const hi = Math.max(a, b), lo = Math.min(a, b);
  const gap = hi - lo;
  let score = hi * 2.2 + lo * 1.1;
  if (i === j) score += 34;              // pares
  if (i < j) score += 10;                // suited bonus
  score -= Math.max(0, gap - 1) * 2.6;   // penalidade de gap (offsuit/suited)
  return score;
}

const raw = [];
let min = Infinity, max = -Infinity;
for (let i = 0; i < 13; i++) {
  raw[i] = [];
  for (let j = 0; j < 13; j++) {
    const s = baseStrength(i, j);
    raw[i][j] = s;
    if (s < min) min = s;
    if (s > max) max = s;
  }
}

const tight = CONFIG.poolTightness;
function freqFor(i, j) {
  const norm = (raw[i][j] - min) / (max - min); // 0..1
  // curva controlada por poolTightness: quanto maior, mais mãos "acendem"
  const shaped = Math.pow(norm, 1.15 - tight * 0.55);
  return Math.round(Math.max(2, Math.min(98, shaped * 100)));
}

function colorFor(pct) {
  // 0-100 -> slate frio (raro) passa por âmbar até vermelho (muito aberto)
  if (pct < 30) {
    const t = pct / 30;
    return mix("#1E293B", "#78350F", t);
  } else if (pct < 65) {
    const t = (pct - 30) / 35;
    return mix("#78350F", "#D97706", t);
  } else {
    const t = (pct - 65) / 35;
    return mix("#F59E0B", "#EF4444", Math.min(1, t));
  }
}
function mix(hexA, hexB, t) {
  const a = hexToRgb(hexA), b = hexToRgb(hexB);
  const r = Math.round(a[0] + (b[0]-a[0])*t);
  const g = Math.round(a[1] + (b[1]-a[1])*t);
  const bl = Math.round(a[2] + (b[2]-a[2])*t);
  return `rgb(${r},${g},${bl})`;
}
function hexToRgb(hex) {
  const v = hex.replace("#","");
  return [parseInt(v.slice(0,2),16), parseInt(v.slice(2,4),16), parseInt(v.slice(4,6),16)];
}

function normalizeHand(h) {
  h = h.trim();
  if (h.length <= 2) return h.toUpperCase();          // par, ex.: "77" -> "77"
  const suffix = h.slice(-1).toLowerCase();            // "s" ou "o"
  return h.slice(0, -1).toUpperCase() + suffix;         // ranks maiúsculos + sufixo minúsculo
}
const highlightSet = new Set((CONFIG.highlightHands || []).map(normalizeHand));

/* colunas de rank (linhas) */
const rankCol = document.getElementById("rankCol");
RANKS.forEach(r => { const s = document.createElement("span"); s.textContent = r; rankCol.appendChild(s); });

/* linha de rank (topo) */
const rankRowTop = document.getElementById("rankRowTop");
RANKS.forEach(r => { const s = document.createElement("span"); s.textContent = r; rankRowTop.appendChild(s); });

/* grade */
const grid = document.getElementById("grid");
let hlBox = null; // bounding box das células destacadas (em índices)
for (let i = 0; i < 13; i++) {
  for (let j = 0; j < 13; j++) {
    const pct = freqFor(i, j);
    const code = handCode(i, j);
    const isHl = highlightSet.has(code);
    const cell = document.createElement("div");
    cell.className = "cell" + (i === j ? " pair" : "");
    cell.style.background = colorFor(isHl ? 88 : pct);
    cell.title = code;
    if (isHl) {
      const ring = document.createElement("div");
      ring.className = "hl-ring";
      cell.appendChild(ring);
      if (!hlBox) hlBox = { minI: i, maxI: i, minJ: j, maxJ: j };
      else {
        hlBox.minI = Math.min(hlBox.minI, i); hlBox.maxI = Math.max(hlBox.maxI, i);
        hlBox.minJ = Math.min(hlBox.minJ, j); hlBox.maxJ = Math.max(hlBox.maxJ, j);
      }
    }
    grid.appendChild(cell);
  }
}

/* callout ligado ao grupo destacado */
if (hlBox && CONFIG.calloutLabel) {
  const cellSize = 40, gap = 3;
  const cx = (hlBox.minJ + hlBox.maxJ + 1) / 2 * (cellSize + gap);
  const cy = (hlBox.minI + hlBox.maxI + 1) / 2 * (cellSize + gap);
  const callout = document.createElement("div");
  callout.className = "callout";
  callout.textContent = CONFIG.calloutLabel;
  // posiciona à direita/abaixo do grupo, dentro do grid (coord. relativas ao .grid)
  const px = Math.min(cx + 46, 13 * (cellSize + gap) - 210);
  const py = Math.min(cy + 30, 13 * (cellSize + gap) - 50);
  callout.style.left = Math.max(0, px) + "px";
  callout.style.top = Math.max(0, py) + "px";
  grid.appendChild(callout);
}

/* ---- bullets horizontais ---- */
const bullets = document.getElementById("bullets");
CONFIG.bullets.forEach(b => {
  const div = document.createElement("div");
  div.className = "bullet";
  div.innerHTML = `<span class="marker">♠</span><span class="text">${b}</span>`;
  bullets.appendChild(div);
});
</script>
</body>
</html>
