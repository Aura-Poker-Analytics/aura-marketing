<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Aura · mockup resultado do Postflop (o que volta depois do Analyze)</title>
<style>
/* ============================================================
   MOCKUP — a ANALISE que volta depois de definir o board.
   RECRIADO em HTML/CSS, nao e captura.

   Parametros:  ?reel=1  (estreito e com tipo grande, pro 9:16)

   ⚠️ UI EM INGLES NOS DOIS IDIOMAS, DE PROPOSITO. O produto e em ingles
   (ver shots/postflop-ref.png), entao o mesmo asset serve ao anuncio PT e ao
   EN — igual ao mockup-cbet-classes. Quem troca de idioma e o TEXTO DO
   ANUNCIO em volta, nao o print.

   ⚠️ NUMEROS: todos transcritos de shots/postflop-ref.png, que e output real
   do produto. O contexto daquele print e SRP · RFI: CO · Caller: BB · Last 2
   Years, SEM filtro de board. Enquanto o output real de um bucket filtrado
   nao chegar, o rail de Active Context aqui NAO pode afirmar filtro de board
   — seria numero de um recorte com rotulo de outro. Ver BOARD_FILTER abaixo.

   Fidelidade a tela real: linha da acao em painel marrom-avermelhado com
   chevron + barra ambar + % a direita e "N hands" abaixo · "Size
   distribution" com barra por size · cards de "Exploitative Sizes" com badge
   Overfold, Defense % e MDF.
   ============================================================ */
@font-face{font-family:"Montserrat";src:url("fonts/Montserrat-Variable-latin.woff2") format("woff2");font-weight:100 900;font-display:block}
:root{
  --bg:#0B1120;            /* = .shotframe do paid-scene, pra emenda sumir */
  --panel:#0B1220; --panel2:#0F1626; --card:#121C2E;
  --slate:#1E2A40; --slate2:#28374F; --track:rgba(148,163,184,0.14);
  --ink:#E7EDF7; --ink-soft:#93A4BF; --ink-dim:#64748B; --ink-off:#445672;
  --amber:#FBBF24; --gold:#D4A418;
  --mar:#7F1D2E; --mar-bd:rgba(153,27,27,0.45); --red:#C9556B;
  --mono:ui-monospace,"Cascadia Mono",Consolas,"SF Mono",monospace;
  --k:1; --winw:1120px;
}
body.reel{ --k:1.42; --winw:880px; }

*{margin:0;padding:0;box-sizing:border-box}
html,body{overflow:hidden}
body{font-family:"Montserrat","Segoe UI",sans-serif;background:var(--bg);
  display:flex;align-items:center;justify-content:center}

.win{width:var(--winw);border-radius:calc(22px*var(--k));overflow:hidden;background:var(--panel);
  border:1px solid rgba(148,163,184,0.10);
  box-shadow:0 46px 110px rgba(0,0,0,0.66), inset 0 1px 0 rgba(255,255,255,0.04)}

.chrome{display:flex;align-items:center;gap:calc(10px*var(--k));
  padding:calc(13px*var(--k)) calc(20px*var(--k));background:#0A1120;border-bottom:1px solid var(--slate)}
.dot{width:calc(11px*var(--k));height:calc(11px*var(--k));border-radius:50%}
.d1{background:#F87171}.d2{background:#FBBF24}.d3{background:#34D399}
.url{margin-left:calc(16px*var(--k));font-size:calc(16px*var(--k));color:var(--ink-dim);
  background:rgba(148,163,184,0.10);border-radius:999px;padding:calc(4px*var(--k)) calc(19px*var(--k))}

.nav{display:flex;align-items:center;gap:calc(18px*var(--k));
  padding:calc(13px*var(--k)) calc(24px*var(--k));border-bottom:1px solid var(--slate);background:#0C1424}
.lg{display:flex;align-items:center;gap:calc(9px*var(--k));color:var(--gold);font-weight:800;
  font-size:calc(20px*var(--k));letter-spacing:0.04em}
.lg .i{width:calc(25px*var(--k));height:calc(20px*var(--k));color:var(--gold)}
.lg .i svg{width:100%;height:100%;display:block}
.tab{font-size:calc(16px*var(--k));font-weight:600;color:var(--ink-dim);
  padding:calc(7px*var(--k)) calc(15px*var(--k));border-radius:calc(9px*var(--k))}
.tab.on{color:#0F1526;font-weight:800;background:var(--amber)}

.body{padding:calc(18px*var(--k)) calc(24px*var(--k)) calc(22px*var(--k))}

/* rail de contexto ativo */
.ctx{border:1px solid var(--slate2);border-radius:calc(12px*var(--k));
  padding:calc(11px*var(--k)) calc(16px*var(--k));margin-bottom:calc(16px*var(--k))}
.ctx .lbl{font-size:calc(10.5px*var(--k));font-weight:700;letter-spacing:0.16em;
  color:var(--ink-dim);margin-bottom:calc(5px*var(--k))}
.ctx .val{font-size:calc(14px*var(--k));font-weight:700;color:var(--amber);line-height:1.4}

.tot{font-size:calc(15px*var(--k));font-weight:700;color:var(--ink);
  padding-bottom:calc(11px*var(--k));border-bottom:1px solid var(--slate);margin-bottom:calc(14px*var(--k))}

/* linha da acao ativa — painel marrom-avermelhado, igual a tela real */
.act{background:linear-gradient(180deg,rgba(120,20,20,0.34),rgba(60,12,12,0.14));
  border:1px solid var(--mar-bd);border-radius:calc(12px*var(--k));
  padding:calc(13px*var(--k)) calc(15px*var(--k));margin-bottom:calc(18px*var(--k))}
.arow{display:flex;align-items:center;gap:calc(11px*var(--k))}
.chev{color:var(--ink-dim);font-size:calc(13px*var(--k));flex:none}
.aname{font-size:calc(16px*var(--k));font-weight:800;color:#F1F5F9;white-space:nowrap}
.track{flex:1;height:calc(9px*var(--k));border-radius:999px;background:var(--track);
  overflow:hidden;min-width:calc(30px*var(--k))}
/* display:block obrigatorio — span inline ignora width e a barra some */
.fill{display:block;height:100%;border-radius:999px;background:var(--amber)}
.pct{flex:none;font-size:calc(20px*var(--k));font-weight:900;color:#fff;font-variant-numeric:tabular-nums}
.hands{margin-top:calc(6px*var(--k));margin-left:calc(24px*var(--k));
  font-size:calc(13px*var(--k));font-weight:600;color:var(--ink-dim)}

.h3{font-size:calc(15px*var(--k));font-weight:800;color:var(--amber);margin-bottom:calc(3px*var(--k))}
.sub{font-size:calc(12px*var(--k));color:var(--ink-dim);margin-bottom:calc(12px*var(--k))}

/* size distribution */
.sd{background:var(--panel2);border:1px solid var(--slate);border-radius:calc(12px*var(--k));
  padding:calc(14px*var(--k)) calc(16px*var(--k));margin-bottom:calc(18px*var(--k))}
.srow{padding:calc(7px*var(--k)) 0}
.stop{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:calc(5px*var(--k))}
.slb{font-size:calc(13.5px*var(--k));font-weight:600;color:var(--ink)}
.sh{font-size:calc(11.5px*var(--k));font-family:var(--mono);color:var(--ink-off)}
.sbot{display:flex;align-items:center;gap:calc(12px*var(--k))}
.spct{flex:none;width:calc(52px*var(--k));text-align:right;font-family:var(--mono);
  font-size:calc(13.5px*var(--k));font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums}

/* exploitative sizes */
.ex{display:grid;grid-template-columns:1fr 1fr;gap:calc(12px*var(--k))}
.exc{background:var(--card);border:1px solid var(--slate);border-radius:calc(11px*var(--k));
  padding:calc(12px*var(--k)) calc(14px*var(--k))}
.exh{display:flex;align-items:center;justify-content:space-between;gap:calc(8px*var(--k));
  margin-bottom:calc(9px*var(--k))}
.exs{font-size:calc(14px*var(--k));font-weight:800;color:var(--ink);white-space:nowrap}
.badge{font-size:calc(11px*var(--k));font-weight:800;color:#FDE2E6;background:var(--mar);
  border-radius:999px;padding:calc(3px*var(--k)) calc(9px*var(--k));white-space:nowrap}
.exm{display:flex;justify-content:space-between;font-size:calc(11.5px*var(--k));
  color:var(--ink-dim);font-weight:600;margin-bottom:calc(7px*var(--k))}
.exbar{position:relative;height:calc(8px*var(--k));border-radius:999px;background:var(--track);overflow:hidden}
.exbar .d{display:block;height:100%;border-radius:999px;background:var(--red)}
.exbar .m{position:absolute;top:calc(-2px*var(--k));width:calc(2px*var(--k));
  height:calc(12px*var(--k));background:var(--amber)}
</style>
</head>
<body>
<div class="win">
  <div class="chrome"><span class="dot d1"></span><span class="dot d2"></span><span class="dot d3"></span>
    <span class="url">aurapoker.com</span></div>

  <div class="nav">
    <div class="lg"><span class="i" data-icon></span>AURA</div>
    <span class="tab">Preflop</span><span class="tab on">Postflop</span><span class="tab">Node-by-Node</span>
  </div>

  <div class="body">
    <div class="ctx"><div class="lbl">ACTIVE CONTEXT</div><div class="val" id="ctxval"></div></div>
    <div class="tot">Total</div>

    <div class="act">
      <div class="arow"><span class="chev">&#9662;</span><span class="aname">XR Flop CBet</span>
        <span class="track"><span class="fill" style="width:13.9%"></span></span>
        <span class="pct">13.9%</span></div>
      <div class="hands">10.6M hands</div>
    </div>

    <div class="h3" id="h-sd">Size distribution</div>
    <div class="sub" id="s-sd">How often the field used each size for this action</div>
    <div class="sd" id="sd"></div>

    <div class="h3" id="h-ex">Exploitative Sizes</div>
    <div class="sub" id="s-ex">Field defense vs MDF, by size</div>
    <div class="ex" id="ex"></div>
  </div>
</div>

<script>
const q = new URLSearchParams(location.search);
if (q.get('reel')) document.body.classList.add('reel');

/* ?part=sizes | expl — o painel inteiro tem 1512px de altura e nao cabe na
   zona segura de um 9:16 sem encolher o texto ate virar borrao. Entao ele sai
   em DUAS cenas, cada uma com uma secao. Sem isso, a cena do payoff fica
   ilegivel justamente onde o anuncio precisa ser lido. */
const PART = q.get('part') || 'all';

/* Enquanto nao chegar o output real de um bucket de board filtrado, o rail
   NAO afirma filtro de board — os numeros abaixo sao do print sem ele. */
const BOARD_FILTER = false;
document.getElementById('ctxval').textContent =
  'SRP · All Tournaments · Any Stage · Any Buy-in · RFI: CO · Caller: BB · Last 2 Years'
  + (BOARD_FILTER ? ' · Board: Two-tone, OESD possible, A' : '');

/* transcrito de shots/postflop-ref.png (output real do produto) */
const SIZES = [
  ['~20% (<27%)',  '137K hands',  9.3],
  ['33%',          '286K hands', 19.5],
  ['42%',          '360K hands', 24.5],
  ['55%',          '242K hands', 16.5],
  ['~75% (57.5-100%)', '244K hands', 16.6],
  ['Overpot (≥100%)',  '200K hands', 13.6],
];
document.getElementById('sd').innerHTML = SIZES.map(([lb, h, p]) => `
  <div class="srow">
    <div class="stop"><span class="slb">${lb}</span><span class="sh">${h}</span></div>
    <div class="sbot">
      <span class="track"><span class="fill" style="width:${(p / 24.5 * 100).toFixed(1)}%"></span></span>
      <span class="spct">${p.toFixed(1)}%</span>
    </div>
  </div>`).join('');

/* Overfold e rotulo do proprio produto. O anuncio NAO infere exploit em cima
   disso — so mostra o que a tela devolve. */
const EXPL = [
  ['~20% (<27%)', 'Overfold 9.4%', 73.9, 83.3],
  ['33%',         'Overfold 9.4%', 65.8, 75.2],
  ['42%',         'Overfold 9.0%', 61.4, 70.4],
  ['55%',         'Overfold 6.8%', 57.7, 64.5],
];
document.getElementById('ex').innerHTML = EXPL.map(([s, b, def, mdf]) => `
  <div class="exc">
    <div class="exh"><span class="exs">${s}</span><span class="badge">${b}</span></div>
    <div class="exm"><span>Defense %: ${def}%</span><span>MDF: ${mdf}%</span></div>
    <div class="exbar"><span class="d" style="width:${def}%"></span><span class="m" style="left:${mdf}%"></span></div>
  </div>`).join('');

if (PART !== 'all') {
  const drop = (...ids) => ids.forEach(i => document.getElementById(i)?.remove());
  if (PART === 'sizes') drop('h-ex', 's-ex', 'ex');
  if (PART === 'expl')  drop('h-sd', 's-sd', 'sd');
}
/* ?compact=1 — tira o rail de contexto e o 'Total'. No carrossel 4:5 o card
   tem 1350px e o painel inteiro nao cabe junto com titulo; cortando esses
   dois o painel encurta ~180px e volta a caber em largura quase cheia, que e
   o que mantem o texto legivel. O contexto passa a viver na legenda. */
if (q.get('compact')) {
  document.getElementById('ctxval')?.closest('.ctx')?.remove();
  document.querySelector('.tot')?.remove();
}

const ICON_PATHS = '<path d="M5.86165 44.898C-5.49315 30.408 0.312736 8.78736 17.5518 1.99342C24.4945 -0.786314 32.5783 -0.656823 39.4165 2.36894C53.1363 8.26508 59.687 24.4384 54.0901 38.1515C53.1232 40.5643 51.8035 42.8347 50.2094 44.8936L49.874 44.6347C50.1658 44.0476 50.4577 43.4736 50.7277 42.8909C54.5649 34.7459 54.4429 24.8226 49.8784 17.1481C42.8921 5.2091 27.6609 0.935911 15.5352 7.87661C3.92345 14.5022 -0.305745 28.8843 4.59855 41.1298C4.81633 41.7039 5.0733 42.3427 5.33899 42.8952C5.60903 43.4779 5.90085 44.052 6.19267 44.639L5.85729 44.898H5.86165Z"/><path d="M28.0486 8.56287C22.2601 20.394 16.4717 32.2251 10.6788 44.0562C12.3905 42.8477 14.9734 41.2895 18.3837 40.1456C19.612 39.7312 22.0293 39.0147 25.2219 38.7212C25.5964 38.5529 26.093 38.2637 26.5285 37.7759C27.012 37.2364 27.1949 36.7055 27.3604 36.2005C27.4519 35.9285 27.5521 35.5573 27.613 35.0998C27.6479 34.8279 27.2777 34.6941 27.1122 34.9185C26.8595 35.2681 26.498 35.635 25.9884 35.9199C25.714 36.071 25.0215 36.4465 24.0807 36.3688C23.031 36.2868 22.3647 35.6955 22.173 35.5228C21.132 34.5775 21.1059 33.2869 21.1016 32.933C21.0798 31.7028 21.6591 30.6885 23.0093 29.0526C24.0894 27.7404 25.7315 25.975 28.0268 24.1017C30.3439 25.975 31.9903 27.7447 33.0748 29.0526C34.4294 30.6928 35.0043 31.7115 34.9825 32.933C34.9782 33.2869 34.9521 34.5775 33.9111 35.5228C33.7238 35.6955 33.0531 36.2825 32.0034 36.3688C31.0626 36.4422 30.3744 36.071 30.0957 35.9199C29.5861 35.635 29.2246 35.2725 28.9719 34.9185C28.8108 34.6941 28.4362 34.8279 28.4711 35.0998C28.532 35.5573 28.6366 35.9285 28.7237 36.2005C28.8936 36.7055 29.0765 37.2364 29.5556 37.7759C29.9911 38.2637 30.4877 38.5529 30.8622 38.7212C34.0548 39.0147 36.4678 39.7356 37.6917 40.1456C41.1064 41.2938 43.6936 42.8477 45.4053 44.0606C39.6168 32.2294 33.8283 20.3983 28.0355 8.56718L28.0486 8.56287Z"/>';
document.querySelectorAll("[data-icon]").forEach(function(el){
  el.innerHTML = '<svg viewBox="0 0 60 45" fill="currentColor" xmlns="http://www.w3.org/2000/svg">' + ICON_PATHS + '</svg>';
});

/* o canvas encosta na janela: margem sobrando vira faixa clara no .shotframe */
(function fit(){
  const r = document.querySelector('.win').getBoundingClientRect();
  const pad = 26;
  const w = Math.ceil(r.width) + pad * 2, h = Math.ceil(r.height) + pad * 2;
  document.documentElement.style.width = document.body.style.width = w + 'px';
  document.documentElement.style.height = document.body.style.height = h + 'px';
  document.title = 'fit:' + w + 'x' + h;
})();
</script>
</body>
</html>
