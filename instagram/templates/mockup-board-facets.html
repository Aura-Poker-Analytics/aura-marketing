<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Aura · mockup seleção de board (Postflop)</title>
<style>
/* ============================================================
   MOCKUP — Seleção de board (textura) no Postflop Analysis.
   RECRIADO em HTML/CSS, nao e captura de tela.

   Parametros:
     ?step=1..4   estado da demo
     ?lang=en     rotulos em ingles + decimais com PONTO
     ?reel=1      variante ESTREITA E GRANDE pro anuncio 9:16
     ?bare=1      fundo transparente

   ⚠️ DUAS ARMADILHAS JA PAGAS, NAO REPETIR:

   1) LEGIBILIDADE. A versao larga (1180px) e otima como imagem solta, mas
      dentro de um quadro 9:16 ela entra a ~1000px de largura e o texto do chip
      vira borrao no celular. Por isso existe o ?reel=1: painel mais ESTREITO
      com tipo MAIOR (--k), que sobe de escala ao inves de descer. As fileiras
      quebram em duas linhas — e proposital, sobra altura no 9:16.

   2) FUNDO. Screenshot de headless com fundo transparente sai com backdrop
      BRANCO, e a margem em volta da janela vira faixa branca dentro do
      .shotframe. O fundo padrao aqui e #0B1120 = a cor do .shotframe do
      paid-scene, entao a emenda some. So use ?bare=1 se o destino tratar alfa.

   As PORCENTAGENS NAO SAO INVENTADAS: a distribuicao medida esta embutida em
   D_FLOP e cada chip e recalculado igual ao produto — a massa de um nivel e
   condicionada aos OUTROS atributos ja selecionados. Por isso a fileira
   Conectividade muda sozinha quando voce liga Two-tone.

   ⚠️ NUNCA MOSTRAR CONTAGEM ABSOLUTA DE MAOS. O painel de referencia tem uma
   linha de contagem embaixo da massa; ela foi REMOVIDA de proposito. O
   "105 milhoes" que circula nos docs e linha de IP+OOP no banco local, nao
   mao unica, e nao e numero de producao. So percentual sai daqui.

   VOCABULARIO travado: Desconectado · OESD possivel · Conectado.
   NUNCA "seco" — o eixo mede so potencial de sequencia, e "monotone seco"
   e um absurdo (AsKs9s e tudo menos seco).
   Rainbow / Two-tone / Monotone / Overcard ficam em ingles nos DOIS idiomas:
   e o vernaculo do jogador em PT-BR.
   ============================================================ */
@font-face{font-family:"Montserrat";src:url("fonts/Montserrat-Variable-latin.woff2") format("woff2");font-weight:100 900;font-display:block}
:root{
  --bg:#0B1120;            /* = .shotframe do paid-scene, pra emenda sumir */
  --panel:#0B1220; --panel2:#0F1626;
  --slate:#1E2A40; --slate2:#28374F; --raise:#16243A;
  --ink:#E7EDF7; --ink-soft:#93A4BF; --ink-dim:#64748B; --ink-off:#44567220;
  --ink-off:#445672;
  --amber:#FBBF24; --gold:#D4A418; --amber-wash:rgba(251,191,36,0.10);
  --mono:ui-monospace,"Cascadia Mono",Consolas,"SF Mono",monospace;
  --k:1;                   /* escala tipografica */
  --winw:1120px;           /* largura da janela */
}
/* variante do anuncio: mais estreita, tipo maior */
body.reel{ --k:1.46; --winw:860px; }

*{margin:0;padding:0;box-sizing:border-box}
html,body{overflow:hidden}
body{font-family:"Montserrat","Segoe UI",sans-serif;background:var(--bg);
  display:flex;align-items:center;justify-content:center}

.win{width:var(--winw);border-radius:calc(22px*var(--k));overflow:hidden;background:var(--panel);
  border:1px solid rgba(148,163,184,0.10);
  box-shadow:0 46px 110px rgba(0,0,0,0.66), inset 0 1px 0 rgba(255,255,255,0.04)}

/* chrome de janela */
.chrome{display:flex;align-items:center;gap:calc(10px*var(--k));
  padding:calc(13px*var(--k)) calc(20px*var(--k));background:#0A1120;
  border-bottom:1px solid var(--slate)}
.dot{width:calc(11px*var(--k));height:calc(11px*var(--k));border-radius:50%}
.d1{background:#F87171}.d2{background:#FBBF24}.d3{background:#34D399}
.url{margin-left:calc(16px*var(--k));font-size:calc(16px*var(--k));color:var(--ink-dim);
  background:rgba(148,163,184,0.10);border-radius:999px;
  padding:calc(4px*var(--k)) calc(19px*var(--k))}

/* nav do app */
.nav{display:flex;align-items:center;gap:calc(18px*var(--k));
  padding:calc(13px*var(--k)) calc(24px*var(--k));border-bottom:1px solid var(--slate);background:#0C1424}
.lg{display:flex;align-items:center;gap:calc(9px*var(--k));color:var(--gold);font-weight:800;
  font-size:calc(20px*var(--k));letter-spacing:0.04em}
.lg .i{width:calc(25px*var(--k));height:calc(20px*var(--k));color:var(--gold)}
.lg .i svg{width:100%;height:100%;display:block}
.tab{font-size:calc(16px*var(--k));font-weight:600;color:var(--ink-dim);
  padding:calc(7px*var(--k)) calc(15px*var(--k));border-radius:calc(9px*var(--k))}
.tab.on{color:#0F1526;font-weight:800;background:var(--amber)}

/* barra de resumo — massa + classes, SEM contagem absoluta */
.sum{display:grid;grid-template-columns:1fr auto;gap:calc(22px*var(--k));align-items:center;
  padding:calc(14px*var(--k)) calc(24px*var(--k));background:var(--panel2);border-bottom:1px solid var(--slate)}
.sum .k{font-size:calc(11px*var(--k));font-weight:700;letter-spacing:0.15em;color:var(--ink-dim);
  text-transform:uppercase;margin-bottom:calc(6px*var(--k))}
.sen{font-size:calc(15px*var(--k));font-weight:600;color:var(--ink);line-height:1.45}
.sen .any{color:var(--ink-off);font-weight:500}
.sen .pin{color:var(--amber)}
.sright{display:flex;gap:calc(30px*var(--k));text-align:right}
.stat .v{font-family:var(--mono);font-size:calc(26px*var(--k));font-weight:700;color:var(--ink);
  font-variant-numeric:tabular-nums;line-height:1.15;white-space:nowrap}
.stat .v small{font-size:calc(15px*var(--k));color:var(--ink-dim);font-weight:600}
.stat.hot .v{color:var(--amber)}

/* fileira = um atributo */
.ghead{display:flex;align-items:center;gap:calc(12px*var(--k));
  padding:calc(13px*var(--k)) calc(24px*var(--k)) calc(4px*var(--k))}
.ghead h2{font-size:calc(11px*var(--k));font-weight:800;letter-spacing:0.16em;
  text-transform:uppercase;color:var(--amber);white-space:nowrap}
.ghead .rule{flex:1;height:1px;background:var(--slate)}
.ghead .note{font-size:calc(12px*var(--k));color:var(--ink-off);white-space:nowrap}
body.reel .ghead .note{display:none}   /* na variante estreita nao cabe */

.row{display:grid;grid-template-columns:calc(132px*var(--k)) 1fr;gap:calc(14px*var(--k));
  align-items:start;padding:calc(5px*var(--k)) calc(24px*var(--k))}
.row:last-child{padding-bottom:calc(16px*var(--k))}
.rlb{font-size:calc(13px*var(--k));color:var(--ink-soft);padding-top:calc(8px*var(--k));font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:calc(6px*var(--k))}

.chip{font-size:calc(13px*var(--k));font-weight:600;display:inline-flex;align-items:baseline;
  gap:calc(8px*var(--k));background:var(--raise);color:var(--ink-soft);border:1px solid var(--slate2);
  border-radius:calc(6px*var(--k));padding:calc(6px*var(--k)) calc(11px*var(--k));white-space:nowrap}
.chip .pct{font-family:var(--mono);font-size:calc(11.5px*var(--k));font-weight:600;
  font-variant-numeric:tabular-nums;color:var(--ink-dim)}
.chip.on{background:var(--amber-wash);border-color:var(--amber);color:var(--amber)}
.chip.on .pct{color:var(--amber)}
/* impossivel: riscado e apagado — vem do dado (massa 0), nao de tabela escrita a mao */
.chip.off{background:transparent;border-color:var(--slate);color:var(--ink-off);
  text-decoration:line-through;text-decoration-color:var(--ink-off)}
.chip.off .pct{color:var(--ink-off);text-decoration:none}
.chip.all{border-style:dashed}
.chip.all.on{border-style:solid}
</style>
</head>
<body>
<div class="win">
  <div class="chrome"><span class="dot d1"></span><span class="dot d2"></span><span class="dot d3"></span>
    <span class="url">aurapoker.com</span></div>

  <div class="nav">
    <div class="lg"><span class="i" data-icon></span>AURA</div>
    <span class="tab">Preflop</span><span class="tab on">Postflop</span><span class="tab">Node-by-Node</span>
  </div>

  <div class="sum">
    <div><div class="k" id="k-sel"></div><div class="sen" id="sen"></div></div>
    <div class="sright">
      <div class="stat hot"><div class="k" id="k-mass"></div><div class="v" id="mass"></div></div>
      <div class="stat"><div class="k" id="k-cls"></div><div class="v" id="cls"></div></div>
    </div>
  </div>

  <div class="ghead"><h2 id="g-title"></h2><span class="rule"></span><span class="note" id="g-note"></span></div>
  <div id="rows"></div>
</div>

<script>
/* distribuicao medida (flop) — injetada pelo build a partir do extrato oficial */
const D_FLOP="1,1,0,2,117069;1,1,0,3,355552;1,1,0,4,705750;1,1,0,5,1177354;1,1,0,6,4176494;1,1,1,1,3913750;1,1,1,2,2607058;1,1,1,3,3360345;1,1,1,4,4037353;1,1,1,5,4751157;1,1,1,6,2596275;1,1,2,1,1991454;1,1,2,2,402543;1,1,2,3,427054;1,1,2,4,439423;1,1,2,5,445423;1,1,2,6,935343;1,2,0,2,19165;1,2,0,3,57819;1,2,0,4,114827;1,2,0,5,191874;1,2,0,6,692151;1,2,1,1,667681;1,2,1,2,431236;1,2,1,3,549243;1,2,1,4,658634;1,2,1,5,775939;1,2,1,6,423185;1,2,2,1,351531;1,2,2,2,70255;1,2,2,3,71601;1,2,2,4,72192;1,2,2,5,72296;1,2,2,6,153007;1,3,0,2,176259;1,3,0,3,538821;1,3,0,4,1076477;1,3,0,5,1809099;1,3,0,6,6450235;1,3,1,1,5924368;1,3,1,2,3936205;1,3,1,3,5095697;1,3,1,4,6158547;1,3,1,5,7286401;1,3,1,6,3992307;1,3,2,1,3061153;1,3,2,2,617139;1,3,2,3,653096;1,3,2,4,672744;1,3,2,5,684872;1,3,2,6,1435401;2,1,0,1,1120552;2,1,0,2,565695;2,1,0,3,674835;2,1,0,4,779368;2,1,0,5,883977;2,1,0,6,1291628;2,1,1,1,1951263;2,1,1,2,327705;2,1,1,3,327961;2,1,1,4,323735;2,1,1,5,318389;2,3,0,1,1155498;2,3,0,2,586463;2,3,0,3,701959;2,3,0,4,810560;2,3,0,5,923355;2,3,0,6,1348174;2,3,1,1,2004066;2,3,1,2,336120;2,3,1,3,337900;2,3,1,4,334979;2,3,1,5,329795;2,1,0,1,143160;2,1,0,2,17587;2,1,0,3,17738;2,1,0,4,17536;2,1,0,5,17635;2,1,0,6,17087";

const q = new URLSearchParams(location.search);
const LANG = q.get('lang') === 'en' ? 'en' : 'pt';
const STEP = Math.max(1, Math.min(4, parseInt(q.get('step') || '1', 10)));
const REEL = !!q.get('reel');
if (REEL) document.body.classList.add('reel');
if (q.get('bare')) document.body.style.background = 'transparent';

const DIMS = ['pf','tn','cf','hc'];
const LV = {
  pf:[[1,{pt:"Não pareado",en:"Unpaired"}],[2,{pt:"Pareado",en:"Paired"}]],
  /* Rainbow/Two-tone/Monotone NAO se traduzem — vernaculo do jogador em PT-BR */
  tn:[[1,"Rainbow"],[3,"Two-tone"],[2,"Monotone"]],
  /* NUNCA "seco": o eixo mede potencial de sequencia, nao secura do board */
  cf:[[0,{pt:"Desconectado",en:"Disconnected"}],[1,{pt:"OESD possível",en:"OESD possible"}],
      [2,{pt:"Conectado",en:"Connected"}]],
  hc:[[1,{pt:"baixa",en:"low"}],[2,"T"],[3,"J"],[4,"Q"],[5,"K"],[6,"A"]]
};
const RLB = { pf:{pt:"Pareamento",en:"Pairing"}, tn:{pt:"Tom",en:"Tone"},
  cf:{pt:"Conectividade",en:"Connectedness"}, hc:{pt:"Carta alta",en:"High card"} };
const ANY = { pf:{pt:"qualquer pareamento",en:"any pairing"}, tn:{pt:"qualquer tom",en:"any tone"},
  cf:{pt:"qualquer conectividade",en:"any connectedness"}, hc:{pt:"qualquer carta alta",en:"any high card"} };
const C = {
  all:{pt:"Todos",en:"All"}, sel:{pt:"Seleção",en:"Selection"},
  mass:{pt:"% da amostra",en:"% of sample"}, cls:{pt:"classes",en:"classes"},
  gtitle:{pt:"Textura do board · Flop",en:"Board texture · Flop"},
  gnote:{pt:"uma fileira por atributo · recalcula a cada clique",
         en:"one row per attribute · recomputed on every click"},
  or:{pt:" ou ",en:" or "}
};
const t = (o) => typeof o === 'string' ? o : o[LANG];

/* estados da demo — o passo 2 e o post inteiro (a fileira Conectividade
   recalcula na frente da camera quando Two-tone entra) */
const STEPS = { 1:{}, 2:{tn:[3]}, 3:{tn:[3],cf:[1]}, 4:{tn:[2]} };

const sel = {}; DIMS.forEach(d => sel[d] = new Set(STEPS[STEP][d] || []));

/* parse + agregacao: mesma matematica do produto */
const map = new Map();
for (const rec of D_FLOP.split(';')) {
  const v = rec.split(',').map(Number); const n = v.pop();
  const k = v.join('|'); map.set(k, (map.get(k) || 0) + n);
}
const ROWS = [...map.entries()].map(([k,n]) => {
  const v = k.split('|').map(Number); const o = {n}; DIMS.forEach((d,i) => o[d] = v[i]); return o;
});
const TOTAL = ROWS.reduce((a,r) => a + r.n, 0);

/* massa de um nivel CONDICIONADA aos outros atributos ja selecionados —
   e isso que faz a fileira vizinha se mexer sozinha */
const hits = (r, skip) => DIMS.every(d => d === skip || !sel[d].size || sel[d].has(r[d]));
const pct = (x) => {
  const s = (100 * x / TOTAL).toFixed(2);
  return (LANG === 'pt' ? s.replace('.', ',') : s) + '%';
};

const host = document.getElementById('rows');
for (const dim of DIMS) {
  const row = document.createElement('div'); row.className = 'row';
  row.innerHTML = '<div class="rlb">' + t(RLB[dim]) + '</div><div class="chips"></div>';
  const box = row.querySelector('.chips');

  let allN = 0; for (const r of ROWS) if (hits(r, dim)) allN += r.n;
  box.innerHTML = '<span class="chip all' + (sel[dim].size ? '' : ' on') + '">' +
    '<span>' + t(C.all) + '</span><span class="pct">' + pct(allN) + '</span></span>';

  for (const [val, label] of LV[dim]) {
    let n = 0; for (const r of ROWS) if (r[dim] === val && hits(r, dim)) n += r.n;
    /* massa 0 => combinacao impossivel => riscado. Vem do dado. */
    const cls = n === 0 ? ' off' : (sel[dim].has(val) ? ' on' : '');
    box.insertAdjacentHTML('beforeend', '<span class="chip' + cls + '">' +
      '<span>' + t(label) + '</span><span class="pct">' + pct(n) + '</span></span>');
  }
  host.appendChild(row);
}

let mass = 0; const leaves = new Set();
for (const r of ROWS) if (hits(r, null)) { mass += r.n; leaves.add(DIMS.map(d => r[d]).join('|')); }

document.getElementById('k-sel').textContent = t(C.sel);
document.getElementById('k-mass').textContent = t(C.mass);
document.getElementById('k-cls').textContent = t(C.cls);
document.getElementById('g-title').textContent = t(C.gtitle);
document.getElementById('g-note').textContent = t(C.gnote);
document.getElementById('mass').innerHTML = pct(mass).replace('%', '<small>%</small>');
document.getElementById('cls').textContent = leaves.size;
document.getElementById('sen').innerHTML = DIMS.map(dim => {
  const names = LV[dim].filter(([v]) => sel[dim].has(v)).map(([,l]) => t(l));
  return names.length ? '<span class="pin">' + names.join(t(C.or)) + '</span>'
                      : '<span class="any">' + t(ANY[dim]) + '</span>';
}).join(' <span class="any">·</span> ');

const ICON_PATHS = '<path d="M5.86165 44.898C-5.49315 30.408 0.312736 8.78736 17.5518 1.99342C24.4945 -0.786314 32.5783 -0.656823 39.4165 2.36894C53.1363 8.26508 59.687 24.4384 54.0901 38.1515C53.1232 40.5643 51.8035 42.8347 50.2094 44.8936L49.874 44.6347C50.1658 44.0476 50.4577 43.4736 50.7277 42.8909C54.5649 34.7459 54.4429 24.8226 49.8784 17.1481C42.8921 5.2091 27.6609 0.935911 15.5352 7.87661C3.92345 14.5022 -0.305745 28.8843 4.59855 41.1298C4.81633 41.7039 5.0733 42.3427 5.33899 42.8952C5.60903 43.4779 5.90085 44.052 6.19267 44.639L5.85729 44.898H5.86165Z"/><path d="M28.0486 8.56287C22.2601 20.394 16.4717 32.2251 10.6788 44.0562C12.3905 42.8477 14.9734 41.2895 18.3837 40.1456C19.612 39.7312 22.0293 39.0147 25.2219 38.7212C25.5964 38.5529 26.093 38.2637 26.5285 37.7759C27.012 37.2364 27.1949 36.7055 27.3604 36.2005C27.4519 35.9285 27.5521 35.5573 27.613 35.0998C27.6479 34.8279 27.2777 34.6941 27.1122 34.9185C26.8595 35.2681 26.498 35.635 25.9884 35.9199C25.714 36.071 25.0215 36.4465 24.0807 36.3688C23.031 36.2868 22.3647 35.6955 22.173 35.5228C21.132 34.5775 21.1059 33.2869 21.1016 32.933C21.0798 31.7028 21.6591 30.6885 23.0093 29.0526C24.0894 27.7404 25.7315 25.975 28.0268 24.1017C30.3439 25.975 31.9903 27.7447 33.0748 29.0526C34.4294 30.6928 35.0043 31.7115 34.9825 32.933C34.9782 33.2869 34.9521 34.5775 33.9111 35.5228C33.7238 35.6955 33.0531 36.2825 32.0034 36.3688C31.0626 36.4422 30.3744 36.071 30.0957 35.9199C29.5861 35.635 29.2246 35.2725 28.9719 34.9185C28.8108 34.6941 28.4362 34.8279 28.4711 35.0998C28.532 35.5573 28.6366 35.9285 28.7237 36.2005C28.8936 36.7055 29.0765 37.2364 29.5556 37.7759C29.9911 38.2637 30.4877 38.5529 30.8622 38.7212C34.0548 39.0147 36.4678 39.7356 37.6917 40.1456C41.1064 41.2938 43.6936 42.8477 45.4053 44.0606C39.6168 32.2294 33.8283 20.3983 28.0355 8.56718L28.0486 8.56287Z"/>';
document.querySelectorAll("[data-icon]").forEach(function(el){
  el.innerHTML = '<svg viewBox="0 0 60 45" fill="currentColor" xmlns="http://www.w3.org/2000/svg">' + ICON_PATHS + '</svg>';
});

/* o canvas encosta na janela: margem sobrando vira faixa dentro do .shotframe */
(function fit(){
  const win = document.querySelector('.win');
  const pad = REEL ? 26 : 30;
  const w = Math.ceil(win.getBoundingClientRect().width) + pad * 2;
  const h = Math.ceil(win.getBoundingClientRect().height) + pad * 2;
  document.documentElement.style.width = document.body.style.width = w + 'px';
  document.documentElement.style.height = document.body.style.height = h + 'px';
  /* o build le isto pra cortar o screenshot no tamanho exato */
  document.title = 'fit:' + w + 'x' + h;
})();
</script>
</body>
</html>
